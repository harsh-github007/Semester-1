/* 20 */ {wk:'Week 1 · Oct 31 – Nov 6',tag:'Derivatives',title:'Hedging with futures',
 one:'A hedge uses futures to <mark>cancel out</mark> a price risk you already have. The hedge ratio tells you how many futures to use when the futures and your exposure do not move one-for-one.',
 plain:`<ul><li><b>Short hedge:</b> you will sell something later (a farmer's wheat). Sell futures now so a price fall is offset by a futures gain.</li>
 <li><b>Long hedge:</b> you will buy something later (an airline's fuel). Buy futures now.</li>
 <li><b>Basis risk:</b> basis = spot − futures. If you hedge with a different but related product (heating oil for jet fuel), or close out early, the basis can move and the hedge is not perfect.</li>
 <li><b>Minimum-variance hedge ratio h*:</b> the slope when you regress changes in your price on changes in the futures price. It is ρ × σ<sub>S</sub>/σ<sub>F</sub>.</li>
 <li><b>Number of contracts:</b> h* × (size of your exposure) / (size of one contract).</li>
 <li><b>Stock index hedge:</b> to remove market risk from a portfolio with beta β, short β × (portfolio value)/(futures price × multiplier) contracts.</li></ul>`,
 formula:'h* = ρ × σS / σF\nN* = h* × QA / QF\nIndex hedge: N* = β × VA / VF',
 legend:'σS, σF = std dev of price changes (spot, futures), ρ = their correlation, QA = units exposed, QF = units per contract, VA = portfolio value, VF = futures price × multiplier.',
 ex:{q:'An airline will buy 2 million gallons of jet fuel. It hedges with heating oil futures (42,000 gallons each). σS = 0.0263, σF = 0.0313, ρ = 0.928. How many contracts?',
  steps:['h* = 0.928 × 0.0263 / 0.0313 = <code>0.7798</code>','Exposure to hedge = 0.7798 × 2,000,000 = <code>1,559,520 gallons</code>','Contracts = 1,559,520 / 42,000 = <code>37.13</code>','Round: buy <code>37</code> heating oil futures (a long hedge, since it will buy fuel).'],
  a:'h* ≈ 0.78, buy about 37 contracts'},
 traps:['Using h = 1 when the futures is on a different product.','Going short when you need to buy later (it is a long hedge).','Forgetting that a hedge also removes your upside.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_04_Lecture_03_Futures_Markets_and_Margins.pptx','Hull 8e, Chapter 3 (Hedging strategies using futures)'],
 calc:{inputs:[['rho','Correlation ρ',0.928],['ss','σ spot',0.0263],['sf','σ futures',0.0313],['qa','Units exposed',2000000],['qf','Units per contract',42000]],
  run:v=>{const h=v.rho*v.ss/v.sf;return `h* = ${v.rho} × ${v.ss} / ${v.sf} = <b>${f4(h)}</b><br>Contracts = ${f4(h)} × ${v.qa.toLocaleString()} / ${v.qf.toLocaleString()} = <b>${(h*v.qa/v.qf).toFixed(2)}</b>`}},
 sketch:{caps:['Each dot is one month: how much jet fuel moved (up) vs how much heating oil futures moved (across).','They move together, but not exactly one-for-one.','The best-fit line has slope 0.78. That slope is the hedge ratio h*.','So hedge 78% of the 2m gallons: 1.56m gallons ÷ 42,000 = 37 contracts.'],
  draw:()=>{const f=F(80,30,380,240,-3,3,-3,3),r=rng(5);let d='';for(let i=0;i<60;i++){const x=gauss(r)*0.95,y=0.78*x+0.32*gauss(r);if(Math.abs(x)<2.9&&Math.abs(y)<2.9)d+=C(f.sx(x).toFixed(1),f.sy(y).toFixed(1),4,'fb')}
   let it=[[0,axes(f,'Δ futures price','Δ jet fuel price',[-2,0,2],[-2,0,2])+d]];
   it.push([1,P(fp(f,x=>x,-2.8,2.8,2),'sm dash')+T(f.sx(2.2),f.sy(2.6),'1-for-1','tm')]);
   it.push([2,P(fp(f,x=>0.78*x,-2.9,2.9,2),'sp')+T(f.sx(1.2),f.sy(0.4),'slope h* = 0.78','tp mono')]);
   it.push([3,R(480,90,150,150,'fh')+T(555,125,'2,000,000','mono','text-anchor="middle"')+T(555,150,'× 0.78','mono','text-anchor="middle"')+T(555,175,'÷ 42,000','mono','text-anchor="middle"')+T(555,212,'= 37','big','text-anchor="middle"')]);return it}}},

/* 21 */ {wk:'Week 4 · Nov 21 – 27',tag:'Derivatives',title:'Option strategies and put-call parity',
 one:'Options can be stacked like Lego to make <mark>any payoff shape</mark> you want. Put-call parity is the rule that links a call and a put with the same strike.',
 plain:`<ul><li><b>Bull call spread:</b> buy a low-strike call, sell a high-strike call. Cheaper than a call alone, but profit is capped. You win if the price rises.</li>
 <li><b>Bear spread:</b> the opposite, for a falling price.</li>
 <li><b>Straddle:</b> buy a call and a put at the same strike. You win if the price moves a lot either way. A bet on volatility.</li>
 <li><b>Strangle:</b> like a straddle with two different strikes. Cheaper, needs a bigger move.</li>
 <li><b>Butterfly:</b> buy calls at K1 and K3, sell two at K2. Wins if the price stays near K2 (Class "Volatility smiles" uses it to find probabilities).</li>
 <li><b>Covered call / protective put:</b> stock + short call, or stock + long put (insurance).</li>
 <li><b>Put-call parity:</b> a call plus cash K·e<sup>−rT</sup> pays the same as a put plus the stock, so they must cost the same. Only for European options.</li>
 <li><b>Bounds:</b> a call is worth at least S − Ke<sup>−rT</sup> and at most S.</li></ul>`,
 formula:'Put-call parity:  c + K·e^(−rT) = p + S0\nCall bounds:      max(S0 − K·e^(−rT), 0) ≤ c ≤ S0\nPut bounds:       max(K·e^(−rT) − S0, 0) ≤ p ≤ K·e^(−rT)',
 legend:'Profit of a strategy = sum of the payoffs − net premium paid.',
 ex:{q:'(a) Buy a $30 call for $3 and sell a $35 call for $1. Max profit and max loss? (b) A European call with K = 30, T = 3 months costs $3. S = $31, r = 10%. What must the put cost?',
  steps:['(a) Net cost = 3 − 1 = <code>2</code>. Max loss = 2 (price ends below 30).','Max payoff = 35 − 30 = 5, so max profit = 5 − 2 = <code>3</code> (price ends above 35).','(b) p = c + K·e^(−rT) − S = 3 + 30·e^(−0.025) − 31','= 3 + 29.259 − 31 = <code>1.26</code>'],
  a:'Spread: max profit 3, max loss 2. Put = $1.26'},
 traps:['Using put-call parity for American options (it only gives bounds there).','Forgetting to subtract the premium when drawing profit.','Mixing up which leg is bought and which is sold in a spread.'],
 files:['Hull 8e, Chapters 10–11 (Properties of options, trading strategies)','Valuation/03 Lectures/FRE6103_LECTURE_11_Options_in_a_valuation_context.pdf'],
 calc:{inputs:[['c','Call price c',3],['s','Stock S0',31],['k','Strike K',30],['r','Rate r (%)',10],['t','Years T',0.25]],
  run:v=>{const pv=v.k*Math.exp(-v.r/100*v.t);return `PV of strike = ${v.k} × e^(−${v.r/100} × ${v.t}) = ${f4(pv)}<br>Put = ${v.c} + ${f4(pv)} − ${v.s} = <b>${f4(v.c+pv-v.s)}</b><br>Call lower bound = max(S − PV(K), 0) = ${f4(Math.max(v.s-pv,0))}`}},
 sketch:{caps:['Start: buy a $30 call. Hockey stick that starts at 30.','Add: sell a $35 call. That flips the slope back to flat above 35.','Together: the bull spread. Profit is capped at 3, loss is capped at 2.','Different idea: a straddle (call + put at the same strike) is a V. It wins on big moves either way.'],
  draw:()=>{const f=F(80,30,470,240,20,45,-6,13);let it=[[0,axes(f,'stock price at expiry','profit',[25,30,35,40],[-4,0,4,8,12],v=>'$'+v)+L(f.x,f.sy(0),f.x+f.w,f.sy(0),'sm')+P(fp(f,s=>Math.max(s-30,0)-3,20,45,100),'sb')+T(f.sx(44.5),f.sy(12.5),'long $30 call','tb mono','text-anchor="end"')]];
   it.push([1,P(fp(f,s=>1-Math.max(s-35,0),20,45,100),'sg dash')+T(f.sx(44),f.sy(-5),'short $35 call','tg mono','text-anchor="end"')]);
   it.push([2,P(fp(f,s=>Math.max(s-30,0)-Math.max(s-35,0)-2,20,45,100),'sp')+T(f.sx(38),f.sy(3)-10,'max profit 3','tp mono')+T(f.sx(21),f.sy(-2)+20,'max loss 2','tp mono')]);
   it.push([3,R(88,22,220,118,'fs')+(()=>{const g=F(108,35,180,80,20,40,-5,8);return P(`M${g.sx(20)},${g.sy(5)}L${g.sx(30)},${g.sy(-5)}L${g.sx(40)},${g.sy(5)}`,'sb')+L(g.x,g.sy(0),g.x+g.w,g.sy(0),'sm')+T(g.sx(30),g.y+g.h+14,'straddle','big','text-anchor="middle" style="font-size:14px"')})()]);return it}}},

/* 22 */ {wk:'Week 3 · Nov 14 – 20',tag:'Valuation',title:'ETFs and futures for end users',
 one:'Futures and ETFs look simple, but an end user faces <mark>hidden costs</mark>: rolling futures in contango, daily-reset leverage in leveraged ETFs, margin calls and basis risk.',
 plain:`<ul><li><b>ETF:</b> a fund that trades like a stock and tracks an index. Low cost, but commodity ETFs usually hold futures, not the commodity.</li>
 <li><b>Roll:</b> futures expire, so a fund sells the near contract and buys the next one every month.</li>
 <li><b>Contango</b> (futures above spot, curve upward): each roll buys higher and the fund slowly loses (negative roll yield). <b>Backwardation</b> (curve downward) gives positive roll yield.</li>
 <li><b>Leveraged ETFs</b> (2×, 3×) reset every day. In a choppy market they lose value even if the index ends flat (volatility decay).</li>
 <li><b>End-user risks:</b> margin/liquidity calls, basis risk, volume (volumetric) risk when you do not know how much you will need to hedge.</li></ul>`,
 formula:'Leveraged ETF over 2 days:  (1 + L·r1)(1 + L·r2)   ≠   1 + L·(total index return)\nRoll yield (approx):         (F_near − F_next) / F_near  per roll',
 legend:'L = leverage (2 for a 2× ETF), r = daily index return.',
 ex:{q:'An index goes +10% then −10%. What happens to the index and to a 2× daily ETF?',
  steps:['Index: 1.10 × 0.90 = <code>0.99</code> → down 1%','2× ETF: day 1 = +20%, day 2 = −20%','1.20 × 0.80 = <code>0.96</code> → down 4%','The ETF lost 4%, not 2× the 1% (2%). That extra loss is volatility decay.'],
  a:'Index −1%, 2× ETF −4%'},
 traps:['Expecting a 2× ETF to give 2× the return over months.','Ignoring roll cost when comparing a commodity ETF to the spot price.','Forgetting that futures hedges can create big cash margin calls even when the hedge works.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_08_Lecture_7_ETFs_and_Futures_MARKUP.pdf','Futures lecture recording (see "Watch online")'],
 sketch:{caps:['An index that goes +10% then −10%: it ends at 99.','A 2× daily ETF: +20% then −20%. It ends at 96, worse than "2 × −1%".','Contango: futures prices rise with maturity. Each month the fund sells cheap near futures and buys pricier ones.','That gap is lost every roll: a slow leak called negative roll yield.'],
  draw:()=>{const f=F(70,40,240,200,0,2,90,125);let it=[[0,axes(f,'day','value',[0,1,2],[95,100,110,120])+P(`M${f.sx(0)},${f.sy(100)}L${f.sx(1)},${f.sy(110)}L${f.sx(2)},${f.sy(99)}`,'sb')+T(f.sx(2)+6,f.sy(99)-4,'99','tb mono')]];
   it.push([1,P(`M${f.sx(0)},${f.sy(100)}L${f.sx(1)},${f.sy(120)}L${f.sx(2)},${f.sy(96)}`,'sp')+T(f.sx(2)+6,f.sy(96)+12,'96','tp mono')+T(f.sx(1),f.sy(122)-6,'2× ETF','tp mono','text-anchor="middle"')]);
   const g=F(400,40,200,200,0,6,60,80);it.push([2,axes(g,'months to expiry','futures price',[1,2,3,4,5],[60,70,80])+P(fp(g,m=>64+2.2*m,0.5,5.5,2),'sg')+T(g.sx(1),g.sy(68)-6,'contango','tg mono')]);
   it.push([3,C(g.sx(1),g.sy(66.2),6,'fp')+C(g.sx(2),g.sy(68.4),6,'fp')+AR(g.sx(1),g.sy(66.2)+18,g.sx(2),g.sy(68.4)+18,'sp')+T(g.sx(1.5),g.sy(63),'sell low, buy high','tp mono','text-anchor="middle"')]);return it}}},

/* 23 */ {wk:'Weeks 5–6 · Nov 28 – Dec 11',tag:'Valuation',title:'Capital budgeting: NPV and IRR',
 one:'A company should take a project if its <mark>NPV is positive</mark>: the present value of what it brings in is more than what it costs. IRR is the discount rate where NPV is exactly zero.',
 plain:`<ul><li><b>NPV:</b> add up the PV of every cash flow, including the (negative) cost today.</li>
 <li><b>Discount rate:</b> the cost of capital, i.e. the return investors could get elsewhere at the same risk (CAPM from the Portfolio class helps here).</li>
 <li><b>IRR:</b> the rate that makes NPV = 0. If IRR > cost of capital, NPV is positive. Find it by trial and error or Excel's IRR().</li>
 <li><b>When IRR misleads:</b> projects of different size, cash flows that change sign more than once (can have two IRRs), or different timing. When in doubt, trust NPV.</li>
 <li><b>Payback period</b> ignores timing and anything after the cutoff. Use it only as a rough check.</li>
 <li>Welch's book also covers <b>capital structure</b>: how mixing debt and equity changes the cost of capital (WACC).</li></ul>`,
 formula:'NPV = Σ CF_t / (1 + r)^t       (t = 0, 1, 2, …)\nIRR: the r where NPV = 0\nWACC = E/V × rE + D/V × rD × (1 − tax)',
 legend:'CF_0 is usually negative (the investment). E, D = market values of equity and debt, V = E + D.',
 ex:{q:'A project costs $100 today and pays $40, $50 and $30 at the end of years 1, 2 and 3. Cost of capital 8%. NPV? IRR?',
  steps:['PV of year 1: 40 / 1.08 = <code>37.04</code>','PV of year 2: 50 / 1.08² = <code>42.87</code>','PV of year 3: 30 / 1.08³ = <code>23.81</code>','NPV = 37.04 + 42.87 + 23.81 − 100 = <code>3.72</code> → take it','IRR (Excel IRR or trial): about <code>10.1%</code>, above 8%. Same answer.'],
  a:'NPV = $3.72, IRR ≈ 10.1%'},
 traps:['Forgetting the year-0 cost.','Choosing between two projects by IRR instead of NPV.','Using a company-wide discount rate for a project with very different risk.'],
 files:['Valuation/02 Books and Readings/FRE6103_BOOK_02_Corporate_Finance_Ivo_Welch_4e_Early_Preview_2016.pdf','Valuation/03 Lectures/FRE6103_LECTURE_13_VL10_Multiperiod_cash_flows.pdf'],
 calc:{inputs:[['c0','Cost today',100],['c1','Year 1',40],['c2','Year 2',50],['c3','Year 3',30],['r','Discount rate (%)',8]],
  run:v=>{const cf=[-v.c0,v.c1,v.c2,v.c3],npv=r=>cf.reduce((s,c,i)=>s+c/Math.pow(1+r,i),0);let lo=-0.99,hi=10,m=0;for(let k=0;k<100;k++){m=(lo+hi)/2;npv(m)>0?lo=m:hi=m}
   return `NPV at ${v.r}% = <b>${f2(npv(v.r/100))}</b> → ${npv(v.r/100)>0?'take it':'reject it'}<br>IRR ≈ <b>${(m*100).toFixed(2)}%</b>`}},
 sketch:{caps:['Cash flows on a timeline: pay $100 now, get 40, 50, 30 later.','Shrink each future amount to today\'s money at 8%, then add. NPV = +3.72.','Now try every discount rate. NPV falls as the rate rises.','Where the curve crosses zero (about 10.1%) is the IRR. Our 8% is to the left, so NPV > 0.'],
  draw:()=>{const y=95;let it=[[0,L(40,y,330,y,'s')+[[0,-100],[1,40],[2,50],[3,30]].map(([t,c])=>{const x=60+t*85;return L(x,y-5,x,y+5,'s')+T(x,y+22,'yr '+t,'tm','text-anchor="middle"')+(c<0?R(x-12,y,24,50,'fp',2)+T(x,y+70,'−100','tp mono','text-anchor="middle"'):R(x-12,y-c*0.9,24,c*0.9,'fg',2)+T(x,y-c*0.9-6,'+'+c,'tg mono','text-anchor="middle"'))}).join('')]];
   it.push([1,T(185,200,'PVs: 37.04 + 42.87 + 23.81 = 103.72','mono','text-anchor="middle"')+R(95,212,180,36,'fh')+T(185,236,'NPV = +3.72','big','text-anchor="middle"')]);
   const npv=r=>-100+40/(1+r)+50/Math.pow(1+r,2)+30/Math.pow(1+r,3),g=F(390,40,220,220,0,0.2,-25,22);
   it.push([2,axes(g,'discount rate','NPV',[0,0.08,0.16],[-20,0,20],v=>(v*100).toFixed(0)+'%')+L(g.x,g.sy(0),g.x+g.w,g.sy(0),'sm')+P(fp(g,npv,0,0.2),'sb')]);
   it.push([3,C(g.sx(0.1013),g.sy(0),7,'fh')+T(g.sx(0.1013)+8,g.sy(0)-12,'IRR 10.1%','mono')+C(g.sx(0.08),g.sy(3.72),5,'fp')+T(g.sx(0.08)-6,g.sy(3.72)-10,'8%','tp mono','text-anchor="end"')]);return it}}},

/* 24 */ {wk:'Weeks 5–6 · Nov 28 – Dec 11',tag:'Risk',title:'Immunization and asset-liability management',
 one:'A pension fund or bank owes money in the future. <mark>Immunization</mark> picks assets whose value moves the same way as those debts when rates change, so a rate move does not hurt.',
 plain:`<ul><li><b>ALM (asset-liability management):</b> manage assets and liabilities together, not separately. The risk is the <i>gap</i> between them.</li>
 <li><b>Duration matching:</b> make the PV of assets equal the PV of liabilities, and their durations equal. Then a small parallel rate shift changes both by about the same amount.</li>
 <li><b>Convexity:</b> also have asset convexity ≥ liability convexity, so bigger moves help rather than hurt.</li>
 <li><b>Rebalance:</b> durations drift as time passes and rates move, so immunization must be redone.</li>
 <li><b>Key-rate duration:</b> the curve does not always shift in parallel. Key-rate durations measure exposure to each part of the curve (2y, 5y, 10y…) separately.</li>
 <li><b>Hedge accounting</b> (RMN8): rules that let a company show a hedge and the item it hedges together in its accounts, so the P&L does not jump around.</li></ul>`,
 formula:'Match PV:        PV(assets) = PV(liabilities)\nMatch duration:  w1·D1 + w2·D2 = D_L,   w1 + w2 = 1\nSurplus change:  ΔS ≈ −(A·D_A − L·D_L) × Δy',
 legend:'w = share of money in each bond, D = duration, A and L = PV of assets and liabilities.',
 ex:{q:'You owe $100m (PV) in 5 years. You can buy 2-year and 10-year zero-coupon bonds. How much of each?',
  steps:['Zero-coupon bond duration = its maturity: D1 = 2, D2 = 10.','Solve w1 × 2 + w2 × 10 = 5 with w1 + w2 = 1.','w2 × 8 = 3 → w2 = <code>0.375</code>, w1 = <code>0.625</code>','Buy $62.5m of 2-year zeros and $37.5m of 10-year zeros (in PV). This "barbell" also has more convexity than the liability.'],
  a:'62.5% in 2-year, 37.5% in 10-year'},
 traps:['Matching maturities instead of durations.','Forgetting to also match PV.','Assuming the hedge lasts forever; durations drift and must be rebalanced.'],
 files:['Risk syllabus RMN2 and RMN8 (duration, immunization, ALM, hedge accounting)','Derivatives/03 Lectures/FRE6073_LECTURE_06_Lecture_05_Duration_and_Swaps.pptx'],
 calc:{inputs:[['dl','Liability duration',5],['d1','Bond 1 duration',2],['d2','Bond 2 duration',10],['pv','PV of liability ($m)',100]],
  run:v=>{const w2=(v.dl-v.d1)/(v.d2-v.d1),w1=1-w2;return `w2 = (${v.dl} − ${v.d1}) / (${v.d2} − ${v.d1}) = <b>${f4(w2)}</b>, w1 = <b>${f4(w1)}</b><br>Buy $${f2(w1*v.pv)}m of bond 1 and $${f2(w2*v.pv)}m of bond 2 (PV)`}},
 sketch:{caps:['A timeline. You owe $100m in present-value terms at year 5.','You can only buy bonds that pay at year 2 and year 10.','Think of a seesaw balanced at year 5: 62.5% at year 2 and 37.5% at year 10 balance it.','Now if rates move a little, assets and the liability move by about the same amount. You are immunized.'],
  draw:()=>{const sx=t=>60+t*52,y=200;let it=[[0,L(40,y,600,y,'s')+[0,2,5,10].map(t=>L(sx(t),y-6,sx(t),y+6,'s')+T(sx(t),y+26,'yr '+t,'tm','text-anchor="middle"')).join('')+R(sx(5)-30,y-90,60,90,'fp',3)+T(sx(5),y-98,'owe $100m','tp mono','text-anchor="middle"')]];
   it.push([1,R(sx(2)-24,y-56,48,56,'fb',3)+T(sx(2),y-64,'2-yr zero','tb mono','text-anchor="middle"')+R(sx(10)-24,y-34,48,34,'fb',3)+T(sx(10),y-42,'10-yr zero','tb mono','text-anchor="middle"')]);
   it.push([2,`<path d="M${sx(5)},${y+40} l-16,26 h32 z" class="fh"/>`+L(sx(2),y+40,sx(10),y+40,'s')+R(sx(2)-28,y+12,56,28,'fb',3)+T(sx(2),y+31,'62.5%','mono','text-anchor="middle" style="fill:var(--sheet)"')+R(sx(10)-22,y+20,44,20,'fb',3)+T(sx(10),y+35,'37.5%','mono','text-anchor="middle" style="fill:var(--sheet);font-size:11px"')]);
   it.push([3,R(150,20,340,44,'fh')+T(320,48,'ΔAssets ≈ ΔLiability','big','text-anchor="middle"')]);return it}}},

/* 25 */ {wk:'Week 2 · Nov 7 – 13',tag:'Risk',title:'Currency and commodity risk',
 one:'Exchange-rate forwards follow <mark>interest rate parity</mark>: the currency with the higher interest rate trades at a discount forward. Commodity forwards add storage costs and a convenience yield.',
 plain:`<ul><li><b>FX quote:</b> EUR/USD = 1.10 means 1 euro costs 1.10 dollars.</li>
 <li><b>Covered interest rate parity:</b> you cannot earn free money by borrowing in one currency, converting, investing in the other, and locking in the rate back. So F = S·e<sup>(r−r<sub>f</sub>)T</sup>.</li>
 <li><b>FX exposure:</b> a US firm with euro revenue loses if the euro falls. Hedge by selling euros forward.</li>
 <li><b>Commodities:</b> holding oil costs storage (u). But having it on hand also has a benefit, the <b>convenience yield</b> (y). F = S·e<sup>(r+u−y)T</sup>.</li>
 <li><b>Contango</b>: F > S (storage dominates). <b>Backwardation</b>: F < S (high convenience yield, e.g. a shortage).</li>
 <li><b>Equity risk</b> (also RMN3): value a stock with dividends or factors (CAPM, multi-factor).</li></ul>`,
 formula:'FX forward:        F = S × e^((r − r_f)·T)\nCommodity forward: F = S × e^((r + u − y)·T)',
 legend:'S = spot price (in domestic currency per unit), r = domestic rate, r_f = foreign rate, u = storage cost rate, y = convenience yield.',
 ex:{q:'EUR/USD spot is 1.10. USD rate 5%, EUR rate 3% (continuous). What is the 1-year forward? A US exporter will receive €1m in a year. What can it lock in?',
  steps:['F = 1.10 × e^((0.05 − 0.03) × 1) = 1.10 × e^0.02','e^0.02 = 1.0202 → F = <code>1.1222</code> USD per EUR','The euro is at a premium because its interest rate is lower.','Sell €1m forward: locks in <code>$1,122,200</code> no matter where the euro goes.'],
  a:'F = 1.1222; locks in $1.1222m'},
 traps:['Flipping r and r_f (check: the lower-rate currency is at a forward premium).','Mixing up which currency the quote is "per".','Leaving out convenience yield when the futures curve is downward sloping.'],
 files:['Risk syllabus RMN3 (FX exposures and parity, equity, commodity carry and basis)','Derivatives/03 Lectures/FRE6073_LECTURE_03_Lecture_02_Forward_and_Futures_Prices.pptx'],
 calc:{inputs:[['s','Spot (USD per EUR)',1.1],['r','Domestic rate r (%)',5],['rf','Foreign rate r_f (%)',3],['t','Years',1],['q','Foreign amount',1000000]],
  run:v=>{const F=v.s*Math.exp((v.r-v.rf)/100*v.t);return `Forward = ${v.s} × e^(${((v.r-v.rf)/100).toFixed(4)} × ${v.t}) = <b>${f4(F)}</b><br>Locked-in amount = ${v.q.toLocaleString()} × ${f4(F)} = <b>${f2(v.q*F)}</b>`}},
 sketch:{caps:['Path 1: keep $1.10 in dollars at 5% for a year. You end with 1.10 × e^0.05.','Path 2: change it to €1, earn 3% in euros, and convert back at the forward rate F.','Both paths must give the same dollars, or there is free money. So F = 1.10 × e^0.02 = 1.1222.','Commodities: storage pushes forward prices up (contango); a convenience yield pulls them down (backwardation).'],
  draw:()=>{let it=[[0,R(40,40,130,50,'fs')+T(105,70,'$1.10 today','mono','text-anchor="middle"')+AR(175,65,420,65,'sb')+T(297,55,'× e^0.05 (USD rate)','tb mono','text-anchor="middle"')+R(425,40,170,50,'fs')+T(510,70,'$1.1564 in 1 yr','mono','text-anchor="middle"')]];
   it.push([1,AR(105,95,105,135,'sg')+R(40,140,130,50,'fs')+T(105,170,'€1 today','mono','text-anchor="middle"')+AR(175,165,420,165,'sg')+T(297,155,'× e^0.03 (EUR rate)','tg mono','text-anchor="middle"')+R(425,140,170,50,'fs')+T(510,170,'€1.0305 in 1 yr','mono','text-anchor="middle"')+AR(510,135,510,95,'sg')+T(520,120,'× F','tg mono')]);
   it.push([2,R(160,205,320,40,'fh')+T(320,232,'F = 1.1564 / 1.0305 = 1.1222','mono','text-anchor="middle"')]);
   const g=F(140,262,360,60,0,4,0,10);it.push([3,P(fp(g,m=>4+1.2*m,0,4,2),'sp')+T(g.sx(4)+6,g.sy(8.8),'contango','tp mono')+P(fp(g,m=>6-1.1*m,0,4,2),'sb')+T(g.sx(4)+6,g.sy(1.6)+6,'backwardation','tb mono')+T(g.x-6,g.y+30,'futures','tm','text-anchor="end"')]);return it}}},

/* 26 */ {wk:'Week 4 · Nov 21 – 27',tag:'Risk + Derivatives',title:'Greeks and delta hedging',
 one:'A trader who sells options removes most of the risk by <mark>holding delta shares</mark> of the stock, then adjusting as delta changes. Gamma says how often you need to adjust.',
 plain:`<ul><li><b>Delta-neutral:</b> total delta of the book = 0, so small stock moves do not change its value.</li>
 <li>Sold calls have negative delta, so you <b>buy</b> shares to hedge. Sold puts have positive delta, so you <b>sell</b> shares.</li>
 <li><b>Gamma:</b> delta changes as the stock moves. New delta ≈ old delta + Γ × ΔS. High gamma = rebalance often.</li>
 <li>A short-option, delta-hedged book has negative gamma: it loses on big moves, and earns theta (time decay) on quiet days.</li>
 <li><b>Gamma/vega hedging:</b> stock has zero gamma and vega, so you need other options to hedge those.</li>
 <li><b>Hedging error:</b> you only rebalance at discrete times and volatility is not what you assumed, so the hedge is never perfect.</li></ul>`,
 formula:'Shares to hold = −(option position) × Δ\nNew Δ ≈ Δ + Γ × ΔS\nP&L of hedged short option ≈ θ·Δt − ½·Γ·(ΔS)²   (per option, sign for a short)',
 legend:'Δ = delta, Γ = gamma, θ = theta (here per unit time, positive for a short option).',
 ex:{q:'You sold 1,000 calls with delta 0.60 and gamma 0.04. How many shares to buy? The stock then rises $1.25. What do you do?',
  steps:['Option delta = −1,000 × 0.60 = −600 → buy <code>600 shares</code>','New delta ≈ 0.60 + 0.04 × 1.25 = <code>0.65</code>','You now need 1,000 × 0.65 = 650 shares','Buy <code>50 more</code>. (Notice: you buy after a rise and sell after a fall. That is how negative gamma costs money.)'],
  a:'Buy 600 shares, then 50 more'},
 traps:['Selling shares to hedge a short call (it is buy).','Thinking delta-neutral means no risk; gamma and vega remain.','Forgetting the contract multiplier (1 contract often = 100 shares).'],
 files:['Hull 8e, Chapter 18 (The Greek letters)','Risk syllabus RMN4 (Greeks, dynamic hedging)'],
 calc:{inputs:[['n','Calls sold',1000],['d','Delta',0.6],['g','Gamma',0.04],['ds','Stock move ($)',1.25]],
  run:v=>{const nd=v.d+v.g*v.ds;return `Start: buy <b>${(v.n*v.d).toFixed(0)}</b> shares<br>New delta ≈ ${v.d} + ${v.g} × ${v.ds} = <b>${f4(nd)}</b><br>Adjust: ${nd>v.d?'buy':'sell'} <b>${Math.abs(v.n*(nd-v.d)).toFixed(0)}</b> shares`}},
 sketch:{caps:['Delta of a call (K = 40) against the stock price. It goes from 0 to 1.','At S = 42 delta is about 0.78. Short 1 call → buy 0.78 shares.','The stock rises to 46. Delta has climbed (that climb is gamma). You must buy more shares.','The steepest part of the curve is near the strike: that is where gamma is highest and you rebalance most.'],
  draw:()=>{const f=F(80,30,470,240,25,60,0,1),de=s=>Nc(bsm(s,40,0.1,0.2,0.5).d1);let it=[[0,axes(f,'stock price S','call delta',[30,40,50,60],[0,0.5,1],v=>'$'+v)+P(fp(f,de,25,60),'sb')]];
   it.push([1,C(f.sx(42),f.sy(de(42)),7,'fp')+T(f.sx(42)+10,f.sy(de(42))+20,'Δ = '+de(42).toFixed(2),'tp mono')]);
   it.push([2,C(f.sx(46),f.sy(de(46)),7,'fg')+AR(f.sx(42)+8,f.sy(de(42))-8,f.sx(46)-6,f.sy(de(46))+4,'sg')+T(f.sx(46)+10,f.sy(de(46))+18,'Δ = '+de(46).toFixed(2)+' → buy more','tg mono')]);
   it.push([3,R(f.sx(34),f.y,f.sx(44)-f.sx(34),f.h,'fsoftp',0)+T(f.sx(39),f.y+16,'high gamma','tp mono','text-anchor="middle"')]);return it}}},

/* 27 */ {wk:'Week 4 · Nov 21 – 27',tag:'Risk',title:'Counterparty risk and CVA',
 one:'If the other side of a derivative defaults while <mark>it owes you money</mark>, you lose. CVA is the price of that risk, built from exposure, default probability and loss given default.',
 plain:`<ul><li><b>Exposure:</b> only positive value matters. If the trade is worth +5 to you and they default, you lose up to 5. If it is worth −5, you still owe them.</li>
 <li><b>Expected exposure EE(t):</b> the average of max(V, 0) across simulated futures. For a swap it rises then falls (a hump), because fewer payments remain later.</li>
 <li><b>PFE (potential future exposure):</b> a high percentile (e.g. 95%) of exposure. Used for limits.</li>
 <li><b>CVA (credit valuation adjustment):</b> expected loss from counterparty default, subtracted from the trade value.</li>
 <li><b>Reducing it:</b> netting, collateral (margin), and central clearing. xVA adds related adjustments (DVA, FVA, KVA).</li>
 <li><b>Migration:</b> a counterparty can be downgraded before defaulting, which raises CVA too.</li></ul>`,
 formula:'Exposure:  E(t) = max(V(t), 0)\nCVA ≈ LGD × Σ EE(t_i) × PD(t_{i−1}, t_i) × DF(t_i)',
 legend:'PD(t_{i−1}, t_i) = probability of default in that period, DF = discount factor.',
 ex:{q:'A 3-year swap has expected exposure $2m, $3m, $1m in years 1, 2, 3. The counterparty has a 2% chance of defaulting in each year; LGD 60%. Ignore discounting. CVA?',
  steps:['Year 1: 2 × 0.02 = <code>0.04</code>','Year 2: 3 × 0.02 = <code>0.06</code>; Year 3: 1 × 0.02 = <code>0.02</code>','Sum = 0.12, times LGD 0.6 = <code>0.072</code>','CVA ≈ $72,000. The trade is worth $72k less than if the counterparty were risk-free.'],
  a:'CVA ≈ $72,000'},
 traps:['Using V instead of max(V, 0).','Using cumulative PD for every year instead of the PD within each period.','Forgetting that collateral and netting cut exposure.'],
 files:['Risk syllabus RMN5–6 (CVA, exposure profiles, xVA)','Hull 8e, Chapter 24 (Credit risk)'],
 sketch:{caps:['Possible future values of a swap. Some paths end up in your favour (above 0), some against you.','Only the part above zero is at risk. Averaging that gives the expected exposure: a hump over time.','Multiply each year\'s exposure by the chance of default in that year.','Add them up and multiply by LGD: CVA ≈ $72k.'],
  draw:()=>{const f=F(80,30,440,200,0,3,-5,6),r=rng(3);let ps='';for(let k=0;k<12;k++){let v=0,d=`M${f.sx(0)},${f.sy(0)}`;for(let t=1;t<=30;t++){v+=gauss(r)*0.45*Math.sqrt(1-t/31);d+=`L${f.sx(t/10).toFixed(1)},${f.sy(Math.max(-4.8,Math.min(5.8,v))).toFixed(1)}`}ps+=P(d,'sm',false)}
   let it=[[0,axes(f,'years','swap value ($m)',[0,1,2,3],[-4,0,4])+L(f.x,f.sy(0),f.x+f.w,f.sy(0),'s')+ps]];
   it.push([1,R(f.x,f.y,f.w,f.sy(0)-f.y,'fsoftg',0)+[[1,2],[2,3],[3,1]].map(([t,e])=>R(f.sx(t)-22,f.sy(e),44,f.sy(0)-f.sy(e),'fg',3)+T(f.sx(t),f.sy(e)-6,'EE $'+e+'m','tg mono','text-anchor="middle"')).join('')]);
   it.push([2,T(f.sx(1),f.sy(-2),'× 2%','tp mono','text-anchor="middle"')+T(f.sx(2),f.sy(-2),'× 2%','tp mono','text-anchor="middle"')+T(f.sx(3)-10,f.sy(-2),'× 2%','tp mono','text-anchor="middle"')]);
   it.push([3,R(150,262,340,44,'fh')+T(320,290,'0.6 × (0.04+0.06+0.02) = 0.072','mono','text-anchor="middle"')]);return it}}},

/* 28 */ {wk:'Week 4 · Nov 21 – 27',tag:'Risk',title:'Operational risk and controls',
 one:'Operational risk is loss from <mark>failed people, processes, systems or outside events</mark>: a fat-finger trade, a hack, a payment sent twice, fraud.',
 plain:`<ul><li><b>Basel definition:</b> loss from inadequate or failed internal processes, people and systems, or from external events. Includes legal risk.</li>
 <li><b>Frequency × severity:</b> many small losses (errors) and rare huge ones (fraud, rogue trading). The rare ones dominate the tail.</li>
 <li><b>Controls:</b> preventive (stop it happening: approvals, access limits) and detective (catch it: reconciliations, alerts).</li>
 <li><b>KRIs (key risk indicators):</b> early-warning numbers, e.g. failed trades per day, staff turnover, overdue reconciliations.</li>
 <li><b>Three lines of defense:</b> 1) the business owns the risk, 2) risk & compliance oversee, 3) internal audit checks independently.</li>
 <li><b>Payments and settlement risk:</b> paying before you get paid (Herstatt risk). Fixed by delivery-versus-payment and CLS for FX.</li>
 <li><b>Technology/cyber risk</b> and model risk sit here too.</li></ul>`,
 formula:'Expected annual loss ≈ expected frequency × expected severity\nResidual risk = inherent risk − effect of controls',
 legend:'Op-risk capital looks at the tail of the loss distribution, not just the average.',
 ex:{q:'A desk has about 12 settlement errors a year, each costing $50,000 on average. A new reconciliation control would catch 75% of them and costs $200,000 a year. Is it worth it (just on expected loss)?',
  steps:['Expected loss now: 12 × 50,000 = <code>$600,000</code> a year','Losses avoided: 75% × 600,000 = <code>$450,000</code>','Net benefit: 450,000 − 200,000 = <code>$250,000</code> a year','Yes, and it also cuts tail risk (fewer chances of one giant error).'],
  a:'Worth it: saves about $250,000 a year'},
 traps:['Looking only at average losses and ignoring rare severe events.','Confusing a control (an action) with a KRI (a measurement).','Treating operational risk as only IT risk.'],
 files:['Risk syllabus RMN7 (operational risk, payments, controls, KRIs, technology risk)'],
 sketch:{caps:['A bow-tie: the risk event sits in the middle (e.g. a payment sent twice).','On the left are the causes: people, process, systems, external events.','Preventive controls sit between causes and the event. They try to stop it.','On the right are the consequences. Detective controls and recovery plans limit the damage.'],
  draw:()=>{let it=[[0,`<path d="M320,120 L360,170 L320,220 L280,170 Z" class="fp"/>`+T(320,250,'risk event','big','text-anchor="middle" style="font-size:16px"')]];
   const causes=['People','Process','Systems','External'],cons=['Money lost','Fines','Reputation','Clients hit'];
   it.push([1,causes.map((c,i)=>{const y=60+i*72;return R(20,y,110,36,'fs')+T(75,y+23,c,'','text-anchor="middle"')+P(`M130,${y+18}L280,170`,'sm',false)}).join('')]);
   it.push([2,R(178,70,32,200,'fb',4)+T(194,60,'prevent','tb mono','text-anchor="middle"')]);
   it.push([3,cons.map((c,i)=>{const y=60+i*72;return R(510,y,120,36,'fs')+T(570,y+23,c,'','text-anchor="middle"')+P(`M360,170L510,${y+18}`,'sm',false)}).join('')+R(430,70,32,200,'fg',4)+T(446,60,'detect','tg mono','text-anchor="middle"')]);return it}}},

/* 29 */ {wk:'Weeks 5–6 · Nov 28 – Dec 11',tag:'Risk',title:'Bank capital and liquidity rules',
 one:'Banks must keep enough <mark>capital</mark> (their own money) to absorb losses and enough <mark>liquid assets</mark> to survive a month of panic withdrawals. Basel III sets the minimums.',
 plain:`<ul><li><b>Capital:</b> equity that can absorb losses. CET1 (common equity tier 1) is the best quality.</li>
 <li><b>Risk-weighted assets (RWA):</b> each asset is weighted by riskiness (cash ~0%, mortgages lower, corporate loans ~100%). Includes market and operational risk too.</li>
 <li><b>Ratios (Basel III minimums):</b> CET1 ≥ 4.5% of RWA, Tier 1 ≥ 6%, total capital ≥ 8%, plus a 2.5% conservation buffer (and extra for big banks).</li>
 <li><b>Leverage ratio:</b> Tier 1 / total exposure (not risk weighted) ≥ 3%. A backstop if risk weights are wrong.</li>
 <li><b>LCR (liquidity coverage ratio):</b> high-quality liquid assets / net cash outflows over 30 days of stress ≥ 100%.</li>
 <li><b>NSFR (net stable funding ratio):</b> stable funding / required stable funding ≥ 100% over one year.</li></ul>`,
 formula:'CET1 ratio = CET1 / RWA              (≥ 4.5%, ≥ 7% with buffer)\nLeverage   = Tier 1 / Total exposure  (≥ 3%)\nLCR        = HQLA / 30-day net outflows (≥ 100%)',
 legend:'HQLA = high-quality liquid assets (cash, central bank reserves, government bonds).',
 ex:{q:'A bank has CET1 $60bn, RWA $800bn, total exposure $1,500bn, HQLA $120bn and stressed 30-day outflows of $100bn. Assume Tier 1 = CET1. Does it pass?',
  steps:['CET1 ratio = 60 / 800 = <code>7.5%</code> ≥ 7% ✓','Leverage = 60 / 1,500 = <code>4.0%</code> ≥ 3% ✓','LCR = 120 / 100 = <code>120%</code> ≥ 100% ✓','It passes all three, but only 0.5% above the CET1 buffer: a $4bn loss would breach it.'],
  a:'7.5% CET1, 4% leverage, 120% LCR: passes'},
 traps:['Dividing capital by total assets for the CET1 ratio (use RWA).','Thinking capital is cash. Capital is how the bank is funded, not what it holds.','Mixing up liquidity (cash to pay today) and solvency (enough capital overall).'],
 files:['Risk syllabus RMN9 (bank balance sheet, capital, leverage, liquidity)','BIS Basel Framework (see "Watch online")'],
 calc:{inputs:[['c','CET1 ($bn)',60],['rwa','RWA ($bn)',800],['ex','Total exposure ($bn)',1500],['h','HQLA ($bn)',120],['o','30-day outflows ($bn)',100]],
  run:v=>{const a=v.c/v.rwa,b=v.c/v.ex,l=v.h/v.o;const ok=x=>x?'✓':'✗';return `CET1 ratio = <b>${(a*100).toFixed(2)}%</b> ${ok(a>=0.07)} (need 7%)<br>Leverage = <b>${(b*100).toFixed(2)}%</b> ${ok(b>=0.03)} (need 3%)<br>LCR = <b>${(l*100).toFixed(0)}%</b> ${ok(l>=1)} (need 100%)`}},
 sketch:{caps:['A bank balance sheet: assets on the left, how they are funded on the right.','Most funding is deposits and debt. A thin slice is equity: that is capital.','Weight the assets by risk to get RWA. Capital must be at least 7% of that (with the buffer).','Liquidity is a separate test: enough liquid assets to cover 30 days of stressed outflows.'],
  draw:()=>{const x1=120,x2=330,w=170,top=30,h=260;let it=[[0,T(x1+w/2,top-8,'Assets','big','text-anchor="middle" style="font-size:16px"')+R(x1,top,w,h*0.15,'fsoftg',2)+T(x1+w/2,top+h*0.08+5,'cash & bonds','','text-anchor="middle"')+R(x1,top+h*0.15,w,h*0.85,'fs',2)+T(x1+w/2,top+h*0.55,'loans','','text-anchor="middle"')]];
   it.push([1,T(x2+w/2,top-8,'Funding','big','text-anchor="middle" style="font-size:16px"')+R(x2,top,w,h*0.62,'fs',2)+T(x2+w/2,top+h*0.32,'deposits','','text-anchor="middle"')+R(x2,top+h*0.62,w,h*0.3,'fs',2)+T(x2+w/2,top+h*0.78,'debt','','text-anchor="middle"')+R(x2,top+h*0.92,w,h*0.08,'fp',2)+T(x2+w+8,top+h*0.97,'equity (CET1)','tp mono')]);
   it.push([2,R(520,60,110,70,'fh')+T(575,88,'CET1 / RWA','mono','text-anchor="middle"')+T(575,112,'≥ 7%','big','text-anchor="middle"')]);
   it.push([3,R(x1-4,top-4,w+8,h*0.15+8,'sb',4).replace('rx','fill="none" rx')+R(520,170,110,70,'fh')+T(575,198,'HQLA / outflow','mono','text-anchor="middle" style="font-size:11px"')+T(575,222,'≥ 100%','big','text-anchor="middle"')]);return it}}},

/* 30 */ {wk:'Weeks 5–6 · Nov 28 – Dec 11',tag:'Risk',title:'P vs Q, risk drivers and stress tests',
 one:'<mark>P</mark> is the real world (what actually tends to happen). <mark>Q</mark> is the risk-neutral world used for pricing. Risk managers measure losses in P, price in Q, and stress-test both.',
 plain:`<ul><li><b>Q (risk-neutral):</b> probabilities that make every asset earn the risk-free rate. Used for pricing (binomial trees, Black-Scholes, CDS). Not a forecast.</li>
 <li><b>P (physical/real world):</b> probabilities from history and judgement. Used for VaR, expected losses, capital.</li>
 <li>Q puts more weight on bad outcomes because investors dislike them. That is why Q default probabilities from spreads are higher than historical ones.</li>
 <li><b>Risk drivers:</b> the few market factors that move a portfolio (rates, spreads, equity index, FX, vol). Map each position to them.</li>
 <li><b>Aggregation:</b> combine risks across desks using correlations; diversification lowers the total, but correlations jump in a crisis.</li>
 <li><b>Ex-ante P&L / stress tests:</b> apply a scenario (e.g. rates +200bp, equities −30%, spreads +150bp) and reprice everything to see the loss before it happens.</li></ul>`,
 formula:'Q default intensity from spread:  λQ ≈ s / LGD\nStress loss ≈ Σ (sensitivity to driver × shock)    (or full revaluation)\nBond:  ΔV ≈ −V × D × Δy',
 legend:'Use P for "how likely / how much could we lose", Q for "what is it worth".',
 ex:{q:'A bond portfolio worth $50m (duration 6) and an equity portfolio worth $30m. Stress: rates +2%, equities −30%. Loss? Also: a spread of 150bp with 60% LGD implies what Q default rate, if history says 1%?',
  steps:['Bonds: −50 × 6 × 0.02 = <code>−$6m</code>','Equities: −30% × 30 = <code>−$9m</code>','Total stress loss ≈ <code>$15m</code> (19% of $80m)','λQ ≈ 0.015 / 0.6 = <code>2.5%</code> a year vs 1% in P. The gap is the credit risk premium.'],
  a:'Stress loss ≈ $15m; Q default rate 2.5% vs P 1%'},
 traps:['Using Q probabilities to forecast real default rates.','Adding stress losses that cannot happen together, or ignoring ones that do.','Trusting normal-times correlations in a stress scenario.'],
 files:['Risk syllabus RMNA (P vs Q, drivers, aggregation, ex-ante P&L, stress)','Valuation notes: instructor-linked explanation of risk neutrality'],
 sketch:{caps:['P: the real-world spread of outcomes for a risky asset. Its average is above the risk-free rate.','Q: the same outcomes reweighted so the average is the risk-free rate. More weight on bad outcomes.','Use P for risk (VaR, expected loss). Use Q for prices.','Stress test: shock each driver and add the hits. Bonds −$6m, equities −$9m, total −$15m.'],
  draw:()=>{const f=F(60,30,330,200,-40,60,0,0.035),nd=(x,m,s)=>Math.exp(-Math.pow(x-m,2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
   let it=[[0,axes(f,'return %','',[-20,0,20,40],[],v=>v+'%')+P(fp(f,x=>nd(x,10,15),-40,60),'sb')+L(f.sx(10),f.y+20,f.sx(10),f.sy(0),'sb dash')+T(f.sx(10)+4,f.y+16,'P mean 10%','tb mono')]];
   it.push([1,P(fp(f,x=>nd(x,4,15),-40,60),'sp')+L(f.sx(4),f.y+40,f.sx(4),f.sy(0),'sp dash')+T(f.sx(4)-4,f.y+36,'Q mean 4% (= rf)','tp mono','text-anchor="end"')]);
   it.push([2,R(60,265,330,50,'fh')+T(225,288,'P → risk & losses','mono','text-anchor="middle"')+T(225,306,'Q → prices','mono','text-anchor="middle"')]);
   const g=F(450,40,160,230,0,2,-16,0);it.push([3,T(g.x,g.y-28,'stress loss ($m)','tm')+L(g.x,g.sy(0),g.x+g.w,g.sy(0),'s')+R(g.sx(0.1),g.sy(0),40,g.sy(-6)-g.sy(0),'fp',2)+T(g.sx(0.1)+20,g.sy(-6)+16,'−6','tp mono','text-anchor="middle"')+T(g.sx(0.1)+20,g.sy(0)-6,'bonds','tm','text-anchor="middle"')+R(g.sx(0.75),g.sy(0),40,g.sy(-9)-g.sy(0),'fp',2)+T(g.sx(0.75)+20,g.sy(-9)+16,'−9','tp mono','text-anchor="middle"')+T(g.sx(0.75)+20,g.sy(0)-6,'stocks','tm','text-anchor="middle"')+R(g.sx(1.4),g.sy(0),40,g.sy(-15)-g.sy(0),'fp',2)+T(g.sx(1.4)+20,g.sy(-15)+16,'−15','tp mono','text-anchor="middle"')+T(g.sx(1.4)+20,g.sy(0)-6,'total','tm','text-anchor="middle"')]);return it}}},

/* 31 */ {wk:'Weeks 2–5 · BMC module',tag:'Bloomberg',title:'Economic indicators',
 one:'Markets move on <mark>surprises</mark>, not on the news itself: what matters is the actual number minus what economists expected.',
 plain:`<ul><li><b>GDP:</b> total output. Growth rate is the headline. Released quarterly.</li>
 <li><b>Inflation (CPI, PCE):</b> how fast prices rise. Central banks target about 2%.</li>
 <li><b>Jobs (nonfarm payrolls, unemployment rate):</b> monthly; one of the biggest market movers in the US.</li>
 <li><b>Surveys (PMI, consumer confidence):</b> early signals. PMI above 50 = expanding.</li>
 <li><b>Leading vs lagging:</b> leading indicators (PMI, building permits) turn before the economy; lagging ones (unemployment) after.</li>
 <li><b>Central bank link:</b> strong growth or high inflation → expect higher policy rates → bond yields up, currency up, often stocks down.</li>
 <li>On the terminal, the economic calendar shows the release time, the consensus (survey) and the actual.</li></ul>`,
 formula:'Surprise = Actual − Consensus\nPositive surprise (strong data) → yields ↑, currency ↑\nNegative surprise → yields ↓, currency ↓',
 legend:'Typical reactions. Real markets can react differently if the details disagree with the headline.',
 ex:{q:'Consensus for US payrolls is +180k. The actual is +250k. Unemployment is unchanged. What do you expect for Treasury yields and the dollar?',
  steps:['Surprise = 250k − 180k = <code>+70k</code>, a strong beat','Stronger jobs → the Fed is less likely to cut rates','Short-term Treasury yields <code>rise</code> (prices fall)','The dollar <code>strengthens</code>, as higher US rates attract money'],
  a:'Yields up, dollar up'},
 traps:['Reacting to the level instead of the surprise.','Mixing up month-over-month and year-over-year inflation.','Forgetting that a bond price falls when its yield rises.'],
 files:['Bloomberg/01 Instructions and Requirements/FRE5500_NOTES_02_Requirements.md','Bloomberg Market Concepts: Economic Indicators module'],
 sketch:{caps:['The economists\' consensus forecast: +180k jobs.','The release: +250k. A +70k surprise.','The market reacts within seconds: 2-year yield jumps up.','And the dollar rises against other currencies.'],
  draw:()=>{const f=F(80,40,250,220,0,2,0,300);let it=[[0,axes(f,'','jobs (thousands)',[],[0,100,200,300])+R(f.sx(0.25),f.sy(180),60,f.sy(0)-f.sy(180),'fm',3)+T(f.sx(0.25)+30,f.sy(180)-8,'180k','mono','text-anchor="middle"')+T(f.sx(0.25)+30,f.y+f.h+18,'consensus','tm','text-anchor="middle"')]];
   it.push([1,R(f.sx(1.15),f.sy(250),60,f.sy(0)-f.sy(250),'fb',3)+T(f.sx(1.15)+30,f.sy(250)-8,'250k','mono tb','text-anchor="middle"')+T(f.sx(1.15)+30,f.y+f.h+18,'actual','tm','text-anchor="middle"')+L(f.sx(0.25),f.sy(180),f.sx(1.15)+60,f.sy(180),'sp dash')+T(f.sx(1.15)+66,f.sy(215),'+70k','tp big')]);
   const g=F(420,40,180,90,0,10,4.2,4.5);it.push([2,T(g.x,g.y-10,'2-yr yield','tm')+P(`M${g.sx(0)},${g.sy(4.25)}L${g.sx(4)},${g.sy(4.26)}L${g.sx(5)},${g.sy(4.42)}L${g.sx(10)},${g.sy(4.40)}`,'sp')+T(g.sx(5.5),g.sy(4.44)-4,'↑','tp big')]);
   const h=F(420,180,180,90,0,10,1.0,1.1);it.push([3,T(h.x,h.y-10,'dollar index (scaled)','tm')+P(`M${h.sx(0)},${h.sy(1.06)}L${h.sx(4)},${h.sy(1.061)}L${h.sx(5)},${h.sy(1.03)}L${h.sx(10)},${h.sy(1.032)}`,'sg')+T(h.x,h.y+h.h+16,'EUR/USD falls = dollar up','tg mono')]);return it}}},

/* 32 */ {wk:'Weeks 2–5 · BMC module',tag:'Bloomberg',title:'Currencies',
 one:'An exchange rate is just <mark>the price of one currency in another</mark>. Interest rates, inflation, growth and risk appetite push it around.',
 plain:`<ul><li><b>Quote:</b> EUR/USD = 1.10 means 1 EUR (the base) = 1.10 USD (the quote currency). If it rises to 1.12, the euro got stronger.</li>
 <li><b>Pips:</b> the 4th decimal (0.0001). Spread = ask − bid.</li>
 <li><b>Interest rate differentials:</b> higher rates attract money → currency tends to strengthen (spot). Forwards follow interest rate parity (see the Risk class on currencies).</li>
 <li><b>Carry trade:</b> borrow in a low-rate currency, invest in a high-rate one. Earns the gap, until a sudden reversal.</li>
 <li><b>PPP (purchasing power parity):</b> in the long run, the same basket should cost the same everywhere; high-inflation currencies weaken.</li>
 <li><b>Safe havens</b> (USD, JPY, CHF) tend to rise in a crisis.</li>
 <li><b>Who cares:</b> exporters, importers, investors holding foreign assets, central banks.</li></ul>`,
 formula:'Amount in quote currency = amount in base × rate\nCross rate: EUR/JPY = EUR/USD × USD/JPY\n% change of base = new rate / old rate − 1',
 legend:'Always write the pair as BASE/QUOTE and keep units: QUOTE per 1 BASE.',
 ex:{q:'EUR/USD = 1.10 and USD/JPY = 150. (a) How many dollars is €2m? (b) What is EUR/JPY? (c) EUR/USD moves to 1.155. How much did the euro gain?',
  steps:['(a) 2,000,000 × 1.10 = <code>$2,200,000</code>','(b) EUR/JPY = 1.10 × 150 = <code>165</code> yen per euro','(c) 1.155 / 1.10 − 1 = <code>+5%</code>','So a US investor holding euro assets gained 5% from the currency alone.'],
  a:'$2.2m; EUR/JPY 165; euro +5%'},
 traps:['Multiplying when you should divide (check units: USD per EUR × EUR = USD).','Reading a fall in EUR/USD as the dollar weakening (it is the dollar strengthening).','Forgetting the currency effect on foreign investments.'],
 files:['Bloomberg Market Concepts: Currencies module'],
 calc:{inputs:[['a','Amount of base currency',2000000],['r','Rate (quote per base)',1.10],['r2','New rate',1.155]],
  run:v=>`Converted = ${v.a.toLocaleString()} × ${v.r} = <b>${f2(v.a*v.r)}</b><br>Base currency change = ${v.r2} / ${v.r} − 1 = <b>${((v.r2/v.r-1)*100).toFixed(2)}%</b><br>Same amount at new rate = ${f2(v.a*v.r2)}`},
 sketch:{caps:['A seesaw: EUR on the left, USD on the right. At 1.10, one euro balances 1.10 dollars.','The ECB raises rates; money flows into euros. The euro side gets heavier: EUR/USD rises to 1.155.','Cross rates: if you know EUR/USD and USD/JPY you can get EUR/JPY by multiplying.'],
  draw:()=>{const sw=(ang,lab)=>{const cx=320,cy=170,L2=200,dx=L2*Math.cos(ang),dy=L2*Math.sin(ang);return L(cx-dx,cy-dy,cx+dx,cy+dy,'s')+R(cx-dx-36,cy-dy-44,72,44,'fb',4)+T(cx-dx,cy-dy-16,'€1','big','text-anchor="middle" style="fill:var(--sheet)"')+R(cx+dx-46,cy+dy-44,92,44,'fg',4)+T(cx+dx,cy+dy-16,lab,'big','text-anchor="middle" style="fill:var(--sheet);font-size:18px"')};
   let it=[[[0,0],`<path d="M320,170 l-20,40 h40 z" class="fh"/>`+sw(0,'$1.10')],[[1,1],`<path d="M320,170 l-20,40 h40 z" class="fh"/>`+sw(-0.12,'$1.155')+T(320,60,'EUR/USD 1.10 → 1.155 (+5%)','mono tb','text-anchor="middle"')]];
   it.push([[2,2],R(80,100,480,120,'fs')+T(320,140,'EUR/USD × USD/JPY = EUR/JPY','big','text-anchor="middle"')+T(320,185,'1.10 × 150 = 165','mono','text-anchor="middle"')]);return it}}},

/* 33 */ {wk:'Weeks 2–5 · BMC module',tag:'Bloomberg',title:'Fixed income and the yield curve',
 one:'A bond\'s price and yield move <mark>in opposite directions</mark>. The yield curve (yields by maturity) shows what the market expects for rates and growth.',
 plain:`<ul><li><b>Price vs yield:</b> rates up → existing bonds with lower coupons are worth less → price down.</li>
 <li><b>Yield curve shapes:</b> normal (upward: longer = higher yield), flat, inverted (short rates above long, often seen before recessions).</li>
 <li><b>Central banks</b> set short rates; long rates reflect expected future short rates plus a term premium.</li>
 <li><b>Credit spread:</b> corporate bond yield − Treasury yield of the same maturity. Wider spread = more perceived default risk.</li>
 <li><b>Ratings:</b> AAA … BBB− is investment grade; BB+ and below is high yield ("junk").</li>
 <li><b>Duration</b> (see the Derivatives class) tells you price sensitivity: duration 7 → about −7% for +1% in yield.</li></ul>`,
 formula:'Credit spread = corporate yield − Treasury yield\nCurve slope   = 10-yr yield − 2-yr yield\n% price change ≈ −Duration × Δyield',
 legend:'1 basis point (bp) = 0.01%.',
 ex:{q:'10-year Treasury yields 4.20%. A BBB company\'s 10-year bond yields 5.50%. The 2-year Treasury yields 4.60%. Spread? Curve shape? If the corporate bond (duration 8) sees its yield rise 0.25%, price change?',
  steps:['Credit spread = 5.50 − 4.20 = <code>1.30% = 130 bp</code>','Slope = 4.20 − 4.60 = <code>−40 bp</code> → the curve is inverted','Price change ≈ −8 × 0.25% = <code>−2%</code>','Inverted curve: markets expect rate cuts ahead, often linked with slowing growth.'],
  a:'Spread 130 bp; inverted curve; price −2%'},
 traps:['Saying a bond price rises when yields rise.','Comparing yields of different maturities when computing a spread.','Writing 130 bp as 13%.'],
 files:['Bloomberg Market Concepts: Fixed Income module','Valuation/03 Lectures/FRE6103_LECTURE_04_Lecture_2B_Bonds_and_rates.pdf'],
 sketch:{caps:['A normal yield curve: you get paid more to lend for longer.','A flat curve: all maturities pay about the same.','An inverted curve: short rates above long rates. Markets expect cuts, often a recession warning.','Add a company\'s curve above the Treasury curve. The gap is the credit spread: 130 bp at 10 years.'],
  draw:()=>{const f=F(80,30,470,230,0,30,2,7);let it=[[0,axes(f,'maturity (years)','yield',[2,5,10,30],[3,4,5,6],v=>v,v=>v+'%')+P(fp(f,m=>3+1.6*(1-Math.exp(-m/6)),0.25,30),'sb')+T(f.sx(30),f.sy(4.55)-10,'normal','tb mono','text-anchor="end"')]];
   it.push([1,P(fp(f,()=>4.2,0.25,30,2),'sm dash')+T(f.sx(30),f.sy(4.2)+16,'flat','tm','text-anchor="end"')]);
   it.push([2,P(fp(f,m=>4.0+0.9*Math.exp(-m/3),0.25,30),'sp')+T(f.sx(1),f.sy(4.95)-8,'inverted','tp mono')]);
   it.push([3,P(fp(f,m=>4.3+1.3*(1-Math.exp(-m/6))+0.9,0.25,30),'sg')+L(f.sx(10),f.sy(4.2+0.0),f.sx(10),f.sy(5.5),'s')+T(f.sx(10)+6,f.sy(4.9),'130 bp','big')+T(f.sx(30),f.sy(6.45)-10,'BBB company','tg mono','text-anchor="end"')]);return it}}},

/* 34 */ {wk:'Weeks 2–5 · BMC module',tag:'Bloomberg',title:'Equities and valuation multiples',
 one:'A share is a slice of a company\'s future profits. Multiples like <mark>P/E</mark> are a quick way to compare how "expensive" companies are.',
 plain:`<ul><li><b>P/E = price / earnings per share.</b> How many dollars you pay for $1 of yearly profit. Higher can mean faster expected growth, or overpricing.</li>
 <li><b>EV/EBITDA:</b> enterprise value (equity + debt − cash) over operating earnings. Compares firms with different debt levels.</li>
 <li><b>Dividend yield</b> = dividend / price. <b>Market cap</b> = price × shares.</li>
 <li><b>DCF (discounted cash flow):</b> the "proper" value: PV of future free cash flows (Valuation classes). A simple version is the Gordon model: P = D<sub>1</sub>/(r − g).</li>
 <li><b>Indices</b> (S&P 500, etc.) track groups of stocks. <b>Beta</b> measures how much a stock moves with the index (Portfolio/CAPM class).</li>
 <li><b>What moves stocks:</b> earnings surprises, guidance, interest rates (higher rates = lower PV of future profits), sector news.</li></ul>`,
 formula:'P/E = Price / EPS\nEV = Market cap + Debt − Cash\nGordon growth: P0 = D1 / (r − g)',
 legend:'EPS = earnings per share, D1 = next year\'s dividend, r = required return, g = growth rate.',
 ex:{q:'A stock is $50 with EPS $2.50 and next year\'s dividend $1.50. Required return 9%, dividends grow 6% a year. P/E? Gordon value? Is it cheap?',
  steps:['P/E = 50 / 2.50 = <code>20×</code>','Gordon value = 1.50 / (0.09 − 0.06) = 1.50 / 0.03 = <code>$50</code>','Model value = market price, so fairly priced under these assumptions.','If growth were only 5%: 1.50 / 0.04 = $37.50, so the price assumes 6% growth.'],
  a:'P/E 20×; Gordon value $50 (fairly priced)'},
 traps:['Comparing P/E across very different industries.','Using Gordon when g ≥ r (the formula breaks).','Forgetting to subtract cash and add debt for EV.'],
 files:['Bloomberg Market Concepts: Equities module','Valuation/02 Books and Readings/FRE6103_BOOK_02_Corporate_Finance_Ivo_Welch_4e_Early_Preview_2016.pdf'],
 calc:{inputs:[['p','Price',50],['e','EPS',2.5],['d','Next dividend D1',1.5],['r','Required return (%)',9],['g','Growth (%)',6]],
  run:v=>`P/E = <b>${(v.p/v.e).toFixed(1)}×</b><br>Gordon value = ${v.d} / (${v.r/100} − ${v.g/100}) = <b>${v.r>v.g?'$'+f2(v.d/((v.r-v.g)/100)):'undefined (g must be below r)'}</b>`},
 sketch:{caps:['A $50 share. Each year it earns $2.50 per share.','So you pay 20 years of today\'s profit: P/E = 20×.','The Gordon model values the growing stream of dividends: 1.50 / (9% − 6%) = $50.','Small changes in growth move the value a lot: at 5% growth the value drops to $37.50.'],
  draw:()=>{let it=[[0,R(60,60,80,200,'fb',4)+T(100,52,'$50 price','mono','text-anchor="middle"')]];
   let e='';for(let i=0;i<20;i++)e+=R(180+i*20,250-10,16,10,'fg',2);it.push([0,T(180,230,'$2.50 earned per year →','tg mono')]);it.push([1,e+T(380,280,'20 years of earnings = P/E 20×','big','text-anchor="middle" style="font-size:16px"')]);
   const f=F(200,40,380,150,0.02,0.08,0,160);it.push([2,R(190,20,400,190,'fs')+axes(f,'growth g','value',[0.04,0.05,0.06,0.07],[0,50,100,150],v=>(v*100).toFixed(0)+'%',v=>'$'+v)+P(fp(f,g=>Math.min(160,1.5/(0.09-g)),0.02,0.08),'sb')+C(f.sx(0.06),f.sy(50),6,'fh')+T(f.sx(0.06)+8,f.sy(50)+18,'$50 at 6%','mono')]);
   it.push([3,C(f.sx(0.05),f.sy(37.5),6,'fp')+T(f.sx(0.05)-8,f.sy(37.5)+18,'$37.50 at 5%','tp mono','text-anchor="end"')]);return it}}}
);

const OTHERS={"Derivatives": "derivatives.html", "Valuation": "valuation.html", "Bloomberg": "bloomberg.html"};

const nav=document.getElementById('nav'),sheet=document.getElementById('sheet'),pick=document.getElementById('pick');
let done={};try{done=JSON.parse(localStorage.getItem('fsb-done-risk')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fsb-done-risk',JSON.stringify(done))}catch(e){}};
function renderNav(cur){let html=`<div class="wk"><button class="cl" data-w="1" aria-current="${cur===-1}"><span class="n">▶</span><span><b>Watch and learn online</b></span><span></span></button></div>`,sj='';const btn=(c,i)=>`<button class="cl" data-i="${i}" aria-current="${i===cur}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${c.title}</span><span class="ok">${done[i]?'✓':''}</span></button>`;
  CLASSES.forEach((c,i)=>{if(c.subj!==sj){if(sj)html+='</div>';sj=c.subj;html+=`<div class="wk"><h4>${sj}</h4>`}html+=btn(c,i);
   if(c===CLASSES[CLASSES.length-1]||CLASSES[i+1].subj!==sj){if(sj==='Risk Management'&&RISK_ALSO.length)html+=`<h4 style="margin-top:8px">Also on the Risk syllabus</h4>`+RISK_ALSO.map(j=>btn(CLASSES[j],j)).join('')}});
  html+='</div>';const ok=Object.entries(OTHERS);if(ok.length)html+=`<div class="wk"><h4>Other subjects</h4>${ok.map(([k,u])=>`<a class="cl" href="${u}"><span class="n">↗</span><span>${k}</span><span></span></a>`).join('')}</div>`;
  nav.innerHTML=html;pick.innerHTML=`<option value="-1" ${cur===-1?'selected':''}>▶ Watch and learn online</option>`+CLASSES.map((c,i)=>`<option value="${i}" ${i===cur?'selected':''}>${c.subj}: ${i+1}. ${c.title}</option>`).join('');
  const n=Object.values(done).filter(Boolean).length;document.getElementById('progtxt').textContent=`${n} of ${CLASSES.length} done`;document.getElementById('progbar').style.width=(n/CLASSES.length*100)+'%'}
nav.addEventListener('click',e=>{const b=e.target.closest('button.cl');if(!b)return;if(b.dataset.w){location.hash='watch';scrollTo({top:0})}else go(+b.dataset.i)});
pick.addEventListener('change',()=>{+pick.value<0?location.hash='watch':go(+pick.value)});
let timer=null,step=0,cur=0;
function go(i){location.hash='class-'+(i+1)}
function show(i){cur=i;step=0;stop();const c=CLASSES[i];renderNav(i);
 sheet.innerHTML=`<div class="head"><span class="num">Class ${i+1} of ${CLASSES.length}</span><span class="tag">${c.subj}</span>${c.tag!==c.subj?`<span class="tag">also ${c.tag.replace(c.subj,'').replace(/^ \+ | \+ $/,'')}</span>`:''}<span class="tag">study ${c.wk}</span></div>
 <h2 class="title">${c.title}</h2><p class="oneline">${c.one}</p>
 <div class="player"><div class="stage"><svg id="svg" viewBox="${W}" role="img" aria-label="Step-by-step sketch for ${c.title}"></svg></div>
  <div class="cap"><span class="k" id="kk"></span><span id="cap"></span></div>
  <div class="ctrl"><button class="btn" id="prev">◀ Back</button><button class="btn primary" id="play">▶ Play</button><button class="btn" id="next">Next ▶</button><div class="dots" id="dots"></div></div></div>
 <div class="grid2">
  <section class="blk plain"><h3>What it means <small>plain words</small></h3>${c.plain}</section>
  <section class="blk"><h3>The formulas <small>for the exam</small></h3><div class="formula">${c.formula}</div><p class="legend">${c.legend}</p></section>
  <section class="blk wide"><h3>Worked example <small>do it on paper first</small></h3><p style="margin:0 0 12px;max-width:70ch"><b>Question.</b> ${c.ex.q}</p><ol class="steps">${c.ex.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><div class="answer">Answer: ${c.ex.a}</div></section>
  ${c.calc?`<section class="blk wide"><h3>Try it yourself <small>change a number, watch the answer</small></h3><div class="calc">${c.calc.inputs.map(([k,l,v])=>`<label for="in-${k}">${l}<input id="in-${k}" data-k="${k}" type="number" step="any" value="${v}"></label>`).join('')}</div><div class="out" id="out"></div></section>`:''}
  <section class="blk plain traps"><h3>Common traps <small>where marks are lost</small></h3><ul>${c.traps.map(t=>`<li>${t}</li>`).join('')}</ul></section>
  <section class="blk files"><h3>Where to read more <small>your folder</small></h3><ul style="margin:0;padding-left:18px">${c.files.map(f=>`<li><code>${f}</code></li>`).join('')}</ul>${c.tag.includes('Risk')?'<p class="note">Your Risk lecture decks (RMN1–RMNA) are not in the folder yet. This class follows the Risk syllabus topics; check it against the decks once you get them.</p>':''}</section>
 </div>
 <div class="foot"><label class="donebox" for="done"><input type="checkbox" id="done" ${done[i]?'checked':''}> I can explain this and solve the example without looking</label>
  <div style="display:flex;gap:8px">${i>0?`<button class="btn" id="pc">◀ Class ${i}</button>`:''}${i<CLASSES.length-1?`<button class="btn primary" id="nc">Class ${i+2} ▶</button>`:''}</div></div>`;
 document.getElementById('prev').onclick=()=>{stop();draw(step-1)};document.getElementById('next').onclick=()=>{stop();draw(step+1)};
 document.getElementById('play').onclick=()=>timer?stop():play();
 document.getElementById('done').onchange=e=>{done[i]=e.target.checked;save();renderNav(i)};
 const pc=document.getElementById('pc'),nc=document.getElementById('nc');if(pc)pc.onclick=()=>{go(i-1);scrollTo({top:0})};if(nc)nc.onclick=()=>{go(i+1);scrollTo({top:0})};
 if(c.calc){const run=()=>{const v={};sheet.querySelectorAll('[data-k]').forEach(x=>v[x.dataset.k]=parseFloat(x.value)||0);let h;try{h=c.calc.run(v)}catch(e){h='Check the inputs.'}document.getElementById('out').innerHTML=h};sheet.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('input',run));run()}
 c._items=c.sketch.draw();draw(0)}
function draw(k){const c=CLASSES[cur],n=c.sketch.caps.length;k=Math.max(0,Math.min(n-1,k));step=k;
 const html=c._items.filter(([s])=>Array.isArray(s)?k>=s[0]&&k<=s[1]:s<=k).map(([s,m])=>{const isNew=Array.isArray(s)?k===s[0]||s[0]===s[1]:s===k;return `<g class="${isNew?'pop':''}">${isNew?m.replace(/class="([^"]*) draw"/g,'class="$1 draw pop"'):m.replace(/ draw"/g,'"')}</g>`}).join('');
 document.getElementById('svg').innerHTML=html;document.getElementById('cap').textContent=c.sketch.caps[k];document.getElementById('kk').textContent=`Step ${k+1}/${n}`;
 document.getElementById('dots').innerHTML=c.sketch.caps.map((_,j)=>`<button class="${j<=k?'on':''}" aria-label="Go to step ${j+1}" data-j="${j}"></button>`).join('');
 document.querySelectorAll('#dots button').forEach(b=>b.onclick=()=>{stop();draw(+b.dataset.j)});
 document.getElementById('prev').disabled=k===0;document.getElementById('next').disabled=k===n-1}
function play(){const c=CLASSES[cur];if(step>=c.sketch.caps.length-1)draw(0);document.getElementById('play').textContent='❚❚ Pause';
 timer=setInterval(()=>{if(step>=CLASSES[cur].sketch.caps.length-1){stop();return}draw(step+1)},4200)}

 sheet.innerHTML=`<div class="head"><span class="num">Free videos and courses</span></div><h2 class="title">Watch and learn online</h2>

 ${Object.entries(RES).map(([k,list])=>`${ONLY?'':`<h3 style="font-size:22px;margin:22px 0 10px">${k}</h3>`}<div class="grid2" style="margin-top:${ONLY?'10px':'0'}">${list.map(([n,u,w,d])=>`<section class="blk"><h3 style="display:block">${n}</h3><p class="legend" style="margin:0 0 8px">${w}</p><p style="margin:0 0 10px">${d}</p><a class="btn" style="display:inline-block;text-decoration:none" href="${u}">Open ↗</a></section>`).join('')}</div>`).join('')}
 <p class="note">Video links open in a new tab. Some of your own course recordings (for example the futures lecture on Zoom) need your NYU login and are listed in Valuation/06 Project and Recording Notes.</p>`}
function route(){if(location.hash==='#watch'){showWatch();return}const m=/^#class-(\d+)$/.exec(location.hash);const i=m?Math.min(CLASSES.length,Math.max(1,+m[1]))-1:0;show(i)}
addEventListener('hashchange',route);route();
</script>
