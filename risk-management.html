<style>
/* Layout: a study notebook. Class list on the left like tabs, one class per page on graph paper, sketch player at the top. */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --grid:#e3e9f2; --ink:#16223a; --mut:#5a6880;
  --blue:#2457d6; --pen:#cf3f35; --green:#1d8656; --hl:#ffe680; --hl-ink:#3a2f00; --line:#cfd8e6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1622; --sheet:#151e2d; --grid:#1d2839; --ink:#e7edf6; --mut:#97a5bb;
  --blue:#7ea7ff; --pen:#ff7b6f; --green:#4fc78d; --hl:#5c4d0f; --hl-ink:#fff0b0; --line:#2a3850; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1622; --sheet:#151e2d; --grid:#1d2839; --ink:#e7edf6; --mut:#97a5bb;
  --blue:#7ea7ff; --pen:#ff7b6f; --green:#4fc78d; --hl:#5c4d0f; --hl-ink:#fff0b0; --line:#2a3850; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 60px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.brand{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--mut);font-size:14px;line-height:1.4}
.prog{font-family:var(--mono);font-size:12px;color:var(--mut);margin:8px 0 2px}
.bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.wk{margin-top:16px}
.wk h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px;font-weight:600}
.cl{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);
  font:inherit;font-size:15px;line-height:1.3;padding:7px 8px;border-radius:8px;cursor:pointer}
.cl:hover{background:var(--grid)}
a.cl{text-decoration:none}
.cl[aria-current="true"]{background:var(--ink);color:var(--paper)}
.cl .n{font-family:var(--mono);font-size:12px;opacity:.7}
.cl .ok{font-size:13px;color:var(--green)}
.cl[aria-current="true"] .ok{color:var(--paper)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.mobile-pick{display:none}
main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,36px);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.head .num{font-family:var(--mono);font-size:13px;color:var(--mut)}
.title{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.015em;margin:4px 0 10px}
.oneline{font-size:20px;line-height:1.45;max-width:62ch;margin:0 0 22px}
.oneline mark,.plain mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:2px}
/* player */
.player{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.stage{overflow-x:auto}
.stage svg{display:block;width:100%;min-width:520px;height:auto}
.cap{border-top:1px dashed var(--line);padding:14px 18px;min-height:86px;font-size:18px;line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.cap .k{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--sheet);border-radius:4px;padding:2px 7px;margin-top:3px;white-space:nowrap}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--paper)}
.btn{font:inherit;font-size:15px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn:focus-visible,.cl:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0;cursor:pointer}
.dots button.on{background:var(--ink)}
/* sections */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:26px}
section.blk{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
section.blk.wide{grid-column:1/-1}
section.blk h3{font-size:20px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
section.blk h3 small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:400}
.plain p{margin:0 0 10px;max-width:65ch}
.plain ul{margin:0;padding-left:20px}.plain li{margin-bottom:6px}
.formula{font-family:var(--mono);font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.7;margin:6px 0 10px}
.legend{font-size:14px;color:var(--mut);margin:0}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:13px;font-weight:600;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
ol.steps code,.plain code{font-family:var(--mono);font-size:14px;background:var(--paper);padding:1px 5px;border-radius:4px;border:1px solid var(--line);overflow-wrap:anywhere}
.answer{margin-top:12px;font-weight:700;background:var(--hl);color:var(--hl-ink);display:inline-block;padding:4px 10px;border-radius:6px}
.traps li::marker{color:var(--pen)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.calc label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.calc input,.calc select{font:inherit;font-family:var(--mono);font-size:15px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.out{font-family:var(--mono);font-size:15px;background:var(--paper);border:1px dashed var(--ink);border-radius:8px;padding:12px 14px;line-height:1.7;overflow-x:auto}
.out b{color:var(--blue)}
.files{font-size:14px;color:var(--mut)}
.files code{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:24px}
.donebox{display:flex;align-items:center;gap:8px;font-size:15px}
.donebox input{width:20px;height:20px;accent-color:var(--green)}
.note{font-size:14px;color:var(--mut);border-left:3px solid var(--pen);padding-left:10px;margin:14px 0 0}
/* svg */
svg text{font-family:var(--body);fill:var(--ink);font-size:15px}
svg .tm{fill:var(--mut);font-size:13px}
svg .tp{fill:var(--pen)} svg .tb{fill:var(--blue)} svg .tg{fill:var(--green)}
svg .big{font-family:var(--display);font-weight:700;font-size:22px}
svg .mono{font-family:var(--mono);font-size:13px}
svg .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .sm{fill:none;stroke:var(--mut);stroke-width:1.5}
svg .sb{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg .sp{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg .sg{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg .dash{stroke-dasharray:6 5}
svg .fb{fill:var(--blue);stroke:none} svg .fp{fill:var(--pen);stroke:none} svg .fg{fill:var(--green);stroke:none}
svg .fh{fill:var(--hl);stroke:none} svg .fs{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
svg .fsoftb{fill:var(--blue);opacity:.16} svg .fsoftp{fill:var(--pen);opacity:.2} svg .fsoftg{fill:var(--green);opacity:.18}
svg .fm{fill:var(--mut);stroke:none}
svg .pop{animation:pop .6s ease-out both}
svg path.pop.draw{animation:draw 1.1s ease-out both;stroke-dasharray:1;stroke-dashoffset:0}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){svg .pop,svg path.pop.draw{animation:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .side .wk{display:none}
  .mobile-pick{display:block;margin-top:10px}
  .mobile-pick select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .cap{font-size:16px}
}

<script>
/* ---------- tiny svg toolkit ---------- */
const T=(x,y,s,c='',a='')=>`<text x="${x}" y="${y}" class="${c}" ${a}>${s}</text>`;
const L=(x1,y1,x2,y2,c='s')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const R=(x,y,w,h,c='fs',rx=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
const C=(x,y,r,c='fs')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
const P=(d,c='s',draw=true)=>{draw=draw&&!c.includes('dash');return `<path d="${d}" class="${c}${draw?' draw':''}"${draw?' pathLength="1"':''}/>`};
const AR=(x1,y1,x2,y2,c='s')=>{const a=Math.atan2(y2-y1,x2-x1),h=10;
  return `<g>${L(x1,y1,x2,y2,c)}<path d="M${x2},${y2} L${x2-h*Math.cos(a-0.45)},${y2-h*Math.sin(a-0.45)} M${x2},${y2} L${x2-h*Math.cos(a+0.45)},${y2-h*Math.sin(a+0.45)}" class="${c}"/></g>`};
function F(x,y,w,h,x0,x1,y0,y1){return{x,y,w,h,x0,x1,y0,y1,sx:v=>x+(v-x0)/(x1-x0)*w,sy:v=>y+h-(v-y0)/(y1-y0)*h}}
function fp(f,fn,a,b,n=90){let d='';for(let i=0;i<=n;i++){const v=a+(b-a)*i/n,yv=fn(v);d+=(i?'L':'M')+f.sx(v).toFixed(1)+','+f.sy(yv).toFixed(1)}return d}
function axes(f,xl,yl,xt=[],yt=[],fmtx=v=>v,fmty=v=>v){let s=L(f.x,f.y+f.h,f.x+f.w,f.y+f.h,'sm')+L(f.x,f.y,f.x,f.y+f.h,'sm');
  xt.forEach(v=>{s+=L(f.sx(v),f.y+f.h,f.sx(v),f.y+f.h+5,'sm')+T(f.sx(v),f.y+f.h+20,fmtx(v),'tm','text-anchor="middle"')});
  yt.forEach(v=>{s+=L(f.x-5,f.sy(v),f.x,f.sy(v),'sm')+T(f.x-8,f.sy(v)+4,fmty(v),'tm','text-anchor="end"')});
  s+=T(f.x+f.w,f.y+f.h+38,xl,'tm','text-anchor="end"')+T(f.x,f.y-10,yl,'tm');return s}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function gauss(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y};
const Nc=x=>0.5*(1+erf(x/Math.SQRT2)), npdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
const f2=v=>Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f4=v=>Number(v).toFixed(4);
function bsm(S,K,r,s,t){const d1=(Math.log(S/K)+(r+s*s/2)*t)/(s*Math.sqrt(t)),d2=d1-s*Math.sqrt(t);return{d1,d2,c:S*Nc(d1)-K*Math.exp(-r*t)*Nc(d2),p:K*Math.exp(-r*t)*Nc(-d2)-S*Nc(-d1)}}

/* ---------- the classes ---------- */
const W='0 0 640 340';
const RAW=[
/* ===== WEEK 1 ===== */
{wk:'Week 1 · Oct 31 – Nov 6',tag:'Valuation',title:'Money today vs money later',
 one:'A dollar later is worth <mark>less</mark> than a dollar today, because today\'s dollar could sit in a bank and grow. Present value (PV) just undoes that growth.',
 plain:`<p>Think of the bank as a time machine for money. Put $V<sub>0</sub> in at 5% and next year you get $V<sub>0</sub> × 1.05. Present value runs the machine backwards: divide instead of multiply.</p>
 <ul><li><b>Future value (FV):</b> what money grows into. Multiply by (1 + r) each year.</li>
 <li><b>Present value (PV):</b> what future money is worth today. Divide by (1 + r) each year.</li>
 <li><b>Discount factor:</b> the number you multiply a future cash flow by to get its PV. For 3 years at 5% it's 1/1.05³ = 0.8638.</li>
 <li><b>Annuity:</b> the same payment every period. <b>Perpetuity:</b> the same payment forever, PV = C / r.</li>
 <li>Prof. Shimko's point ("PV fails"): PV only works cleanly when you know the cash flows and the right rate. Risky cash flows need a risk adjustment, which later classes cover.</li></ul>`,
 formula:'PV = CF / (1 + r)^t\nPerpetuity:  PV = C / r\nAnnuity:     PV = C × [1 − (1+r)^(−n)] / r',
 legend:'CF = cash flow, r = rate per period, t = number of periods, C = repeating payment.',
 ex:{q:'You will get $100 in 3 years. The bank pays 5% a year. What is it worth today?',
  steps:['Write the formula: <code>PV = 100 / 1.05^3</code>','Work out 1.05³ = 1.05 × 1.05 × 1.05 = <code>1.157625</code>','Divide: <code>100 / 1.157625 = 86.38</code>','Check by going forward: 86.38 × 1.157625 = 100. It works.'],
  a:'PV = $86.38'},
 traps:['Using an annual rate with monthly cash flows. Match the rate to the period (6% a year = 0.5% a month).','Mixing up multiply (future) and divide (present).','Forgetting that a perpetuity\'s first payment comes one period from now, not today.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_01_Lecture_1_Present_Value_Fails.pdf','Valuation/02 Books and Readings/FRE6103_BOOK_03_Valuation_Principles_Ch_1_2.pdf'],
 calc:{inputs:[['fv','Future cash flow ($)',100],['r','Rate per period (%)',5],['n','Periods',3]],
  run:v=>{const df=1/Math.pow(1+v.r/100,v.n);return `Discount factor = 1 / ${(1+v.r/100).toFixed(4)}^${v.n} = <b>${f4(df)}</b><br>PV = ${f2(v.fv)} × ${f4(df)} = <b>$${f2(v.fv*df)}</b>`}},
 sketch:{caps:['This is a timeline. Today is year 0. Someone promises you $100 at year 3.','Move the $100 back one year: divide by 1.05. It shrinks to $95.24.','Back one more year: divide by 1.05 again. Now $90.70.','Back to today: $86.38. That is the present value. Smaller coin, same "worth".','Shortcut: do all three divides at once. PV = 100 ÷ 1.05³ = 86.38.'],
  draw:()=>{const xs=[80,240,400,560],vals=[86.38,90.70,95.24,100],y=200;let it=[[0,L(50,y,600,y,'s')]];
   xs.forEach((x,i)=>it.push([0,L(x,y-8,x,y+8,'s')+T(x,y+32,'Year '+i,'tm','text-anchor="middle"')]));
   const coin=(i,c)=>C(xs[i],y-60,18+vals[i]*0.18,c)+T(xs[i],y-55,'$'+vals[i].toFixed(2),'mono','text-anchor="middle"');
   it.push([0,coin(3,'fh')+T(560,80,'promised','tm','text-anchor="middle"')]);
   [[1,3,2],[2,2,1],[3,1,0]].forEach(([s,a,b])=>it.push([s,AR(xs[a]-40,y-110,xs[b]+40,y-110,'sp')+T((xs[a]+xs[b])/2,y-120,'÷ 1.05','tp','text-anchor="middle"')+coin(b,s===3?'fh':'fs')]));
   it.push([3,T(80,y+60,'Present value','tb big','text-anchor="middle"')]);
   it.push([4,R(170,268,300,44,'fh')+T(320,297,'PV = 100 ÷ 1.05³ = 86.38','big','text-anchor="middle"')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Derivatives',title:'How often interest is added',
 one:'"10% a year" can mean different amounts of money depending on <mark>how often</mark> interest is added. Continuous compounding is the limit where it is added every instant.',
 plain:`<p>If the bank adds interest twice a year, you earn interest on your interest sooner, so you end up with a bit more. Same headline rate, different result. That is why every rate needs a <b>compounding frequency</b> attached.</p>
 <ul><li><b>m times a year:</b> grow by (1 + R/m) each piece, m pieces a year.</li>
 <li><b>Continuous:</b> grow by e<sup>Rt</sup>. Derivatives math (forwards, Black-Scholes) almost always uses this.</li>
 <li><b>Converting:</b> two rates are "the same" if they grow $1 to the same amount in one year.</li></ul>`,
 formula:'Compounded m times:  FV = A × (1 + R/m)^(m·t)\nContinuous:          FV = A × e^(R·t)\nConvert m → cont:    Rc = m × ln(1 + Rm/m)\nConvert cont → m:    Rm = m × (e^(Rc/m) − 1)',
 legend:'A = amount, R = annual rate, m = times per year, t = years, ln = natural log.',
 ex:{q:'You have 10% a year compounded twice a year. What is the continuously compounded rate?',
  steps:['Each half year you grow by 1 + 0.10/2 = <code>1.05</code>','Use the convert rule: <code>Rc = 2 × ln(1.05)</code>','ln(1.05) = 0.04879, times 2 = <code>0.09758</code>','Check: e^0.09758 = 1.1025, and 1.05² = 1.1025. Same growth.'],
  a:'Rc = 9.758% continuous'},
 traps:['Plugging a semiannual rate into e^(rT) without converting it.','Using t in months when the rate is per year.','Thinking a higher m changes the headline rate. It only changes how much you actually earn.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_05_Lecture_04_Interest_Rates.pptx','Hull 8e, Chapter 4 (Interest Rates)'],
 calc:{inputs:[['r','Annual rate (%)',10],['m','Times per year',2]],
  run:v=>{const R=v.r/100,rc=v.m*Math.log(1+R/v.m);return `$100 after 1 year = 100 × (1 + ${R}/${v.m})^${v.m} = <b>$${f2(100*Math.pow(1+R/v.m,v.m))}</b><br>Same as continuous rate Rc = ${v.m} × ln(1 + ${(R/v.m).toFixed(4)}) = <b>${(rc*100).toFixed(3)}%</b>`}},
 sketch:{caps:['$100 at 10% a year. Added once a year, it jumps to $110 at the end.','Added twice a year: $105 after 6 months, then 5% on $105 gives $110.25.','Monthly: 12 tiny jumps. You end at $110.47.','Continuous: a smooth curve, interest every instant. You end at $110.52.','The more often you compound, the more you get, but it levels off at e^0.10.'],
  draw:()=>{const f=F(80,40,380,220,0,1,99,111);let it=[[0,axes(f,'time (years)','$ value',[0,0.25,0.5,0.75,1],[100,104,108,111])]];
   const stair=m=>{let d=`M${f.sx(0)},${f.sy(100)}`,v=100;for(let k=1;k<=m;k++){d+=`L${f.sx(k/m)},${f.sy(v)}`;v*=1+0.1/m;d+=`L${f.sx(k/m)},${f.sy(v)}`}return d};
   it.push([0,P(stair(1),'s')+T(f.sx(1)+8,f.sy(110)+5,'$110.00 (yearly)','mono')]);
   it.push([1,P(stair(2),'sg')+T(f.sx(0.5)+6,f.sy(105)-8,'$105','tg mono')]);
   it.push([2,P(stair(12),'sp')]);
   it.push([3,P(fp(f,t=>100*Math.exp(0.1*t),0,1),'sb')+T(f.sx(1)+8,f.sy(110.52)-14,'$110.52 (continuous)','tb mono')]);
   it.push([4,R(110,70,290,40,'fh')+T(255,96,'limit = 100 × e^0.10','big','text-anchor="middle"')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Valuation',title:'Loans: payments, default and prepayment',
 one:'A loan payment is split into <mark>interest first</mark>, then the rest pays down what you owe. A pool of loans also loses money to people who default or pay off early.',
 plain:`<p>This is the lecture's own example: borrow $5,000 for 24 months at 6% a year. Every month you pay the same amount. Early on most of it is interest, later most of it is principal, because the balance (and so the interest) keeps shrinking.</p>
 <ul><li><b>Amortization:</b> paying the loan down to zero with equal payments.</li>
 <li><b>Borrower's view:</b> what does it cost me? <b>Lender's view:</b> what cash do I actually get back?</li>
 <li><b>Default:</b> some borrowers stop paying. In the course model, a fixed share of the remaining pool defaults each month (0.5% in Mini Project 1).</li>
 <li><b>Prepayment:</b> some borrowers pay everything early (1% a month in the project). The lender gets cash sooner but loses future interest.</li></ul>`,
 formula:'Payment:   PMT = B × i / [1 − (1+i)^(−n)]\nEach month: interest = balance × i\n            principal paid = PMT − interest\n            new balance = balance − principal paid\nPool left after k months ≈ (1 − d − p)^k',
 legend:'B = amount borrowed, i = monthly rate (6%/12 = 0.5%), n = number of months, d = monthly default share, p = monthly prepay share.',
 ex:{q:'Borrow $5,000 for 24 months at 6% a year. What is the payment, and what happens in month 1?',
  steps:['Monthly rate i = 6% / 12 = <code>0.005</code>','PMT = 5000 × 0.005 / (1 − 1.005^(−24)) = <code>$221.60</code> (Excel: PMT(0.06/12,24,−5000))','Month 1 interest = 5000 × 0.005 = <code>$25.00</code>','Principal paid = 221.60 − 25.00 = <code>$196.60</code>, new balance = <code>$4,803.40</code>'],
  a:'Payment $221.60; balance after month 1 is $4,803.40'},
 traps:['Using 6% instead of 0.5% for the month.','Forgetting interest is paid before principal.','In the pool model, default and prepayment both shrink the balance, but only default loses money.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_03_Lecture_2A_Loans_with_exponential_default_risk.pdf','Valuation/07 Earlier Midterm Materials/FRE6103_REVIEW_02_Mini_Project_1_Two_Sides_of_a_Loan_Instructions.txt'],
 calc:{inputs:[['b','Amount borrowed ($)',5000],['r','Annual rate (%)',6],['n','Months',24]],
  run:v=>{const i=v.r/1200,p=v.b*i/(1-Math.pow(1+i,-v.n)),int=v.b*i;return `Monthly rate = ${(i*100).toFixed(4)}%<br>Payment = <b>$${f2(p)}</b><br>Month 1: interest $${f2(int)}, principal $${f2(p-int)}, balance <b>$${f2(v.b-p+int)}</b><br>Total paid = $${f2(p*v.n)}, so total interest = $${f2(p*v.n-v.b)}`}},
 sketch:{caps:['You borrow $5,000. That tall bar is what you owe at month 0.','Each month you pay $221.60. Red part = interest, blue part = paying down the loan.','Over 24 months the balance falls to zero.','Notice the red part shrinks and the blue part grows: less balance means less interest.','For a lender with a pool of loans, defaults and prepayments make the pool (dashed) shrink faster.'],
  draw:()=>{const i=0.005,p=221.603;let bal=[5000];for(let k=1;k<=24;k++)bal.push(bal[k-1]*(1+i)-p);
   const f=F(70,30,520,160,-0.5,24.5,0,5000),g=F(70,230,520,70,-0.5,24.5,0,230);
   let it=[[0,axes(f,'','balance owed',[],[0,2500,5000],0,v=>'$'+v)+R(f.sx(0)-8,f.sy(5000),16,f.sy(0)-f.sy(5000),'fb',2)]];
   it.push([1,T(g.x,g.y-8,'each payment: interest vs principal','tm')]);
   let pay1='';{const int=5000*i;pay1=R(g.sx(1)-7,g.sy(p),14,g.sy(p-int)-g.sy(p),'fp',1)+R(g.sx(1)-7,g.sy(p-int),14,g.sy(0)-g.sy(p-int),'fb',1)}
   it.push([1,pay1+T(g.x+g.w,g.y-8,'month 1: $25 interest + $196.60 principal','mono','text-anchor="end"')]);
   let bars='',pays='';for(let k=1;k<=24;k++){const b=Math.max(bal[k],0);bars+=R(f.sx(k)-8,f.sy(b),16,f.sy(0)-f.sy(b),'fb',2);
    if(k>1){const int=bal[k-1]*i;pays+=R(g.sx(k)-7,g.sy(p),14,g.sy(p-int)-g.sy(p),'fp',1)+R(g.sx(k)-7,g.sy(p-int),14,g.sy(0)-g.sy(p-int),'fb',1)}}
   it.push([2,bars]);it.push([3,pays]);
   let d='';let pool=5000;for(let k=0;k<=24;k++){const v=Math.max(bal[k],0)*Math.pow(1-0.015,k);d+=(k?'L':'M')+f.sx(k)+','+f.sy(v)}
   it.push([4,P(d,'sp dash')+T(f.x+f.w,f.y-10,'dashed: pool after 0.5% default + 1% prepay a month','tp mono','text-anchor="end"')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Valuation + Derivatives',title:'Bonds and building a zero curve',
 one:'A zero-coupon bond pays one amount at one date, so its price tells you <mark>today\'s value of $1 at that date</mark>. Bootstrapping peels these discount factors out of coupon bonds one date at a time.',
 plain:`<p>A coupon bond is just a bundle of little zero-coupon bonds, one for each payment. If you already know the discount factor for the early dates, you can subtract those pieces from the bond price. What's left must be the value of the last payment, which gives you the next discount factor. Repeat. That is <b>bootstrapping</b>.</p>
 <ul><li><b>Discount factor Z(t):</b> price today of $1 paid at time t.</li>
 <li><b>Zero rate:</b> the rate that matches Z(t). Continuous: r = −ln Z(t) / t.</li>
 <li><b>Zero curve / term structure:</b> zero rates plotted against maturity. Mini Project 2 builds this from Treasury data.</li></ul>`,
 formula:'Bond price = Σ CF(t) × Z(t)\nZ(t) = e^(−r·t)      →   r = −ln Z(t) / t\nBootstrap last date:  Z(T) = (Price − Σ earlier CF × Z) / CF(T)',
 legend:'CF(t) = cash flow at time t, Z(t) = discount factor, r = zero rate (continuous).',
 ex:{q:'A 6-month zero sells at $98 per $100. A 1-year bond with a 4% coupon paid twice a year ($2 every 6 months) sells at $99. Find Z(0.5) and Z(1).',
  steps:['Zero bond: <code>Z(0.5) = 98 / 100 = 0.98</code>','The 1-year bond pays $2 at 0.5 years and $102 at 1 year.','Value of the first coupon: <code>2 × 0.98 = 1.96</code>','What is left: <code>99 − 1.96 = 97.04 = 102 × Z(1)</code>, so <code>Z(1) = 0.9514</code>','Zero rates: −ln(0.98)/0.5 = <code>4.04%</code>, −ln(0.9514)/1 = <code>4.98%</code>'],
  a:'Z(0.5) = 0.98, Z(1) = 0.9514; zero rates 4.04% and 4.98%'},
 traps:['Forgetting the final payment includes the coupon (102, not 100).','Using the annual coupon (4) instead of the half-year coupon (2).','Mixing continuous and annual zero rates.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_04_Lecture_2B_Bonds_and_rates.pdf','Valuation/04 Spreadsheets and Data/FRE6103_DATA_08_Treasury_data_090426.xlsx','Derivatives/03 Lectures/FRE6073_LECTURE_05_Lecture_04_Interest_Rates.pptx'],
 sketch:{caps:['Start with the easy one. A 6-month zero costs $98 for $100. So $1 in 6 months is worth $0.98 today.','Next, a 1-year coupon bond costing $99. It pays $2 at 6 months and $102 at 1 year.','We already know how to value the $2: 2 × 0.98 = $1.96.','The rest of the price must be the $102: 99 − 1.96 = 97.04. So Z(1) = 97.04 / 102 = 0.9514.','Turn each Z into a rate and plot. That is your zero curve.'],
  draw:()=>{const x0=80,x1=300,x2=520,y=170;let it=[[0,L(50,y,600,y,'s')+[['now',x0],['0.5 yr',x1],['1 yr',x2]].map(([t,x])=>L(x,y-6,x,y+6,'s')+T(x,y+26,t,'tm','text-anchor="middle"')).join('')]];
   it.push([0,R(x1-24,y-100,48,100,'fb',3)+T(x1,y-108,'$100','mono','text-anchor="middle"')+T(x0,y-60,'pay $98','mono tp','text-anchor="middle"')+AR(x1-30,y-50,x0+40,y-50,'sp')+T(x0,y-34,'Z(0.5)=0.98','mono','text-anchor="middle"')]);
   it.push([1,R(x1+30,y-6,26,6,'fg',1)+T(x1+43,y-14,'$2','tg mono','text-anchor="middle"')+R(x2-24,y-102,48,102,'fg',3)+T(x2,y-110,'$102','tg mono','text-anchor="middle"')+T(x0,y+60,'bond costs $99','mono tg','text-anchor="middle"')]);
   it.push([2,AR(x1+30,y+40,x0+50,y+40,'sb')+T((x0+x1)/2+20,y+56,'2 × 0.98 = 1.96','tb mono','text-anchor="middle"')]);
   it.push([3,R(320,262,300,62,'fh')+T(470,286,'99 − 1.96 = 97.04 = 102 × Z(1)','mono','text-anchor="middle"')+T(470,310,'Z(1) = 0.9514','big','text-anchor="middle"')]);
   const g=F(140,80,380,180,0,1.1,3.8,5.2);it.push([4,R(30,10,580,320,'fs',8)+T(320,50,'Zero curve','big','text-anchor="middle"')+axes(g,'maturity (yrs)','zero rate',[0.5,1],[4,4.5,5],v=>v,v=>v+'%')+T(g.sx(0.5)+10,g.sy(4.04)+20,'4.04%','tp mono')+T(g.sx(1)-10,g.sy(4.98)-12,'4.98%','tp mono','text-anchor="end"')+P(`M${g.sx(0.5)},${g.sy(4.04)}L${g.sx(1)},${g.sy(4.98)}`,'sp')+C(g.sx(0.5),g.sy(4.04),4,'fp')+C(g.sx(1),g.sy(4.98),4,'fp')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Derivatives',title:'The four derivatives and their payoffs',
 one:'A derivative is a contract whose value <mark>comes from</mark> something else (a stock, a rate, oil). There are four basic kinds: forwards, futures, swaps and options.',
 plain:`<ul><li><b>Forward:</b> agree today to buy (long) or sell (short) at a fixed price K on a later date. Both sides must go through with it. Made privately (over the counter).</li>
 <li><b>Future:</b> the same idea, but traded on an exchange, standardized, and settled every day through margin (Class 7).</li>
 <li><b>Swap:</b> trade one stream of payments for another, e.g. fixed interest for floating (Class 9).</li>
 <li><b>Option:</b> the <i>right but not the obligation</i>. A call is the right to buy at K, a put the right to sell at K. You pay a premium up front for that right.</li></ul>
 <p><b>Payoff</b> is what you get at the end. <b>Profit</b> is payoff minus what you paid. Draw the picture every time; it stops sign mistakes.</p>`,
 formula:'Long forward payoff  = S_T − K\nShort forward payoff = K − S_T\nLong call payoff     = max(S_T − K, 0)\nLong put payoff      = max(K − S_T, 0)\nProfit = payoff − premium paid',
 legend:'S_T = price of the asset at the end, K = agreed (strike/delivery) price.',
 ex:{q:'You buy a call with strike $100 for a $5 premium. At expiry the stock is $120. What is your payoff and profit? What if the stock is $90?',
  steps:['At $120: payoff = max(120 − 100, 0) = <code>20</code>','Profit = 20 − 5 = <code>15</code>','At $90: payoff = max(90 − 100, 0) = <code>0</code> (you just do not use the option)','Profit = 0 − 5 = <code>−5</code>. The most a call buyer can lose is the premium.'],
  a:'At $120: payoff 20, profit 15. At $90: payoff 0, profit −5'},
 traps:['Mixing payoff with profit.','Saying a forward costs money to enter. A fair forward costs nothing up front.','Forgetting the short side of an option can lose a lot.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_02_Lecture_01_Introduction_to_Derivatives.pdf','Hull 8e, Chapters 1 and 10'],
 sketch:{caps:['Long forward: you win $1 for every $1 the price ends above K, and lose the same below.','Short forward: the mirror image. Your gain is exactly the other side\'s loss.','Long call: you only use it if the price is above K. Dashed line = profit after paying the premium.','Long put: you profit when the price falls below K. Insurance for a stock owner.','Four shapes to remember: two straight lines, two "hockey sticks".'],
  draw:()=>{const box=(x,y)=>F(x+30,y+18,240,100,0,200,-80,80);const fs=[box(10,10),box(330,10),box(10,175),box(330,175)];
   const ttl=['Long forward','Short forward','Long call (K=100)','Long put (K=100)'];
   const fn=[s=>s-100,s=>100-s,s=>Math.max(s-100,0),s=>Math.max(100-s,0)];let it=[];
   fs.forEach((f,i)=>{it.push([i,L(f.x,f.sy(0),f.x+f.w,f.sy(0),'sm')+L(f.sx(100),f.y,f.sx(100),f.y+f.h,'sm dash')+T(f.x,f.y-4,ttl[i],'big','style="font-size:16px"')+T(f.x+f.w,f.sy(0)+16,'S_T','tm','text-anchor="end"')+T(f.sx(100)+4,f.y+f.h-4,'K','tm')+P(fp(f,s=>Math.max(-80,Math.min(80,fn[i](s))),20,180),'sb')]);
    if(i>=2)it.push([i,P(fp(f,s=>Math.max(-80,Math.min(80,fn[i](s)-12)),20,180),'sp dash')+T(f.x+f.w-4,f.y+12,'profit','tp mono','text-anchor="end"')])});
   it.push([4,R(240,150,160,30,'fh')+T(320,170,'payoff ≠ profit','mono','text-anchor="middle"')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Derivatives',title:'Forward price by no-arbitrage',
 one:'The fair forward price is <mark>what it costs to buy the asset now with borrowed money and carry it</mark> to the delivery date. Any other price gives someone free money.',
 plain:`<p>Arbitrage means a riskless profit with no money down. Markets hunt it away. So: if you can borrow $40 at 5%, buy the stock, and hold it a year, it costs you $40 × e^0.05 = $42.05 to own the stock in a year. A forward to buy it in a year must also cost $42.05, otherwise you would do one and the opposite of the other.</p>
 <ul><li><b>Income</b> (dividends) makes holding the stock cheaper, so subtract its PV: F = (S − I)e<sup>rT</sup>.</li>
 <li><b>Dividend yield q</b> or a foreign interest rate r<sub>f</sub> works the same: F = S e<sup>(r−q)T</sup>.</li>
 <li><b>Forward price vs forward value:</b> a new forward is worth 0. An old one with delivery price K is worth (F<sub>0</sub> − K)e<sup>−rT</sup> to the long side.</li></ul>`,
 formula:'No income:        F0 = S0 × e^(rT)\nKnown income I:   F0 = (S0 − I) × e^(rT)\nYield q / FX:     F0 = S0 × e^((r − q)T)     (q = r_f for currency)\nValue of long:    f  = (F0 − K) × e^(−rT)',
 legend:'S0 = spot price now, r = risk-free rate (continuous), T = years, K = delivery price written in an existing contract.',
 ex:{q:'A stock is $40, pays no dividend, r = 5%, T = 1 year. (a) Fair forward price? (b) The market quotes $43. How do you make money? (c) An old contract has K = $40. What is it worth?',
  steps:['(a) F0 = 40 × e^0.05 = <code>42.05</code>','(b) $43 is too high. Sell the forward at 43, borrow $40, buy the stock.','In a year: deliver the stock, receive 43, repay the loan 42.05. Profit <code>0.95</code> with no risk.','(c) f = (42.05 − 40) × e^(−0.05) = <code>1.95</code> for the long side.'],
  a:'F0 = 42.05; arbitrage profit 0.95; old contract worth 1.95'},
 traps:['Mixing price (the K that makes value 0) and value (what an existing contract is worth).','Adding dividends instead of subtracting them.','Doing the arbitrage in the wrong direction. Forward too high means sell the forward and buy the asset.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_03_Lecture_02_Forward_and_Futures_Prices.pptx','Derivatives/04 Assignments and Solutions/FRE6073_SOLUTION_03_Assignment_01_Solutions.pdf'],
 calc:{inputs:[['s','Spot price S0',40],['r','Rate r (%)',5],['q','Yield q or r_f (%)',0],['t','Years T',1],['k','Old contract K',40]],
  run:v=>{const F=v.s*Math.exp((v.r-v.q)/100*v.t),f=(F-v.k)*Math.exp(-v.r/100*v.t);return `Fair forward F0 = ${v.s} × e^(${((v.r-v.q)/100).toFixed(4)} × ${v.t}) = <b>${f4(F)}</b><br>Value of old long contract = (${F.toFixed(4)} − ${v.k}) × e^(−${v.r/100} × ${v.t}) = <b>${f4(f)}</b>`}},
 sketch:{caps:['Today the stock costs $40. You can borrow at 5%.','Strategy: borrow $40 and buy the stock. Costs you nothing today.','In one year you own the stock and owe 40 × e^0.05 = $42.05.','If someone offers a forward at $43, sell it to them. Deliver the stock, get 43, repay 42.05. Free $0.95.','So the only price with no free money is F0 = $42.05.'],
  draw:()=>{let it=[[0,T(130,40,'TODAY','big','text-anchor="middle"')+T(470,40,'IN 1 YEAR','big','text-anchor="middle"')+L(320,20,320,320,'sm dash')+R(70,70,120,60,'fs')+T(130,106,'Stock $40','','text-anchor="middle"')]];
   it.push([1,R(70,170,120,60,'fs')+T(130,198,'Bank lends','','text-anchor="middle"')+T(130,218,'$40','mono','text-anchor="middle"')+AR(130,170,130,135,'sg')+T(150,155,'buy','tg mono')]);
   it.push([2,R(400,70,140,60,'fs')+T(470,106,'You hold stock','','text-anchor="middle"')+R(400,170,140,60,'fs')+T(470,198,'You owe','','text-anchor="middle"')+T(470,218,'$42.05','mono tp','text-anchor="middle"')+AR(195,200,395,200,'sp')]);
   it.push([3,R(560,110,70,70,'fh')+T(595,140,'F=$43','mono','text-anchor="middle"')+T(595,160,'+0.95','mono tg','text-anchor="middle"')+AR(545,100,575,110,'sb')]);
   it.push([4,R(170,262,300,46,'fh')+T(320,292,'F0 = 40 × e^0.05 = 42.05','big','text-anchor="middle"')]);return it}}},

{wk:'Week 1 · Oct 31 – Nov 6',tag:'Derivatives',title:'Futures, margin and daily settlement',
 one:'With futures, gains and losses are <mark>paid every day</mark> through a margin account, so nobody can build up a big unpaid loss.',
 plain:`<ul><li><b>Initial margin:</b> the deposit to open the position.</li>
 <li><b>Marking to market:</b> each day the exchange moves money between buyers and sellers based on the new futures price.</li>
 <li><b>Maintenance margin:</b> a floor. If your account drops below it you get a <b>margin call</b> and must top it back up to the <i>initial</i> margin.</li>
 <li><b>Clearing house:</b> stands between buyer and seller, so you never depend on the other trader paying. That removes most counterparty risk.</li>
 <li><b>Basis</b> = spot price − futures price. It goes to zero at delivery.</li></ul>`,
 formula:'Daily gain (long) = (F_today − F_yesterday) × contract size × number of contracts\nIf balance < maintenance → deposit (initial − balance)',
 legend:'Short positions get the opposite sign.',
 ex:{q:'You go long 2 gold futures (100 oz each) at $1,250. Initial margin $6,000 per contract, maintenance $4,500. Prices: 1,241 → 1,238 → 1,233 → 1,236. Track the account.',
  steps:['Start: 2 × 6,000 = <code>$12,000</code>. Each $1 move = 2 × 100 = $200.','Day 1: −9 × 200 = −1,800 → <code>$10,200</code>','Day 2: −3 × 200 = −600 → <code>$9,600</code>','Day 3: −5 × 200 = −1,000 → <code>$8,600</code>, below the $9,000 floor. Margin call: deposit <code>$3,400</code> to get back to $12,000.','Day 4: +3 × 200 = +600 → <code>$12,600</code>'],
  a:'Margin call of $3,400 on day 3; balance $12,600 after day 4'},
 traps:['Topping up only to the maintenance level. You go back to the initial margin.','Forgetting to multiply by contract size and number of contracts.','Thinking margin is a fee. It is your money, held as a deposit.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_04_Lecture_03_Futures_Markets_and_Margins.pptx','Hull 8e, Chapter 2'],
 sketch:{caps:['You open with $12,000. The dashed red line is the $9,000 maintenance floor.','Day 1: gold falls $9. You lose $1,800 that day. Balance $10,200.','Day 2: down $3 more. Balance $9,600.','Day 3: down $5. Balance $8,600 is under the floor. Margin call! Add $3,400 to get back to $12,000.','Day 4: gold rises $3. You gain $600. Balance $12,600.'],
  draw:()=>{const f=F(90,40,480,220,0,4,8000,13000);const pts=[[0,12000],[1,10200],[2,9600],[3,8600],[4,12600]];
   let it=[[0,axes(f,'day','margin account',[0,1,2,3,4],[8000,9000,10000,12000],v=>v,v=>'$'+v.toLocaleString())+L(f.x,f.sy(9000),f.x+f.w,f.sy(9000),'sp dash')+T(f.x+f.w,f.sy(9000)-6,'maintenance $9,000','tp mono','text-anchor="end"')+L(f.x,f.sy(12000),f.x+f.w,f.sy(12000),'sm dash')+T(f.x+f.w,f.sy(12000)-6,'initial $12,000','tm','text-anchor="end"')+C(f.sx(0),f.sy(12000),6,'fb')]];
   for(let k=1;k<=4;k++){let d=`M${f.sx(k-1)},${f.sy(k===4?12000:pts[k-1][1])}L${f.sx(k)},${f.sy(pts[k][1])}`;
    it.push([k,P(d,'sb')+C(f.sx(k),f.sy(pts[k][1]),6,k===3?'fp':'fb')+T(f.sx(k),f.sy(pts[k][1])+(k===4?-14:24),'$'+pts[k][1].toLocaleString(),'mono','text-anchor="middle"')])}
   it.push([3,AR(f.sx(3)+14,f.sy(8600),f.sx(3)+14,f.sy(12000)+8,'sg')+T(f.sx(3)+22,f.sy(10300),'+$3,400','tg mono')]);return it}}},

/* ===== WEEK 2 ===== */
{wk:'Week 2 · Nov 7 – 13',tag:'Derivatives + Risk',title:'Forward rates, duration and convexity',
 one:'Duration tells you <mark>how much a bond price drops when rates rise</mark>. Convexity is the correction, because the real price curve bends.',
 plain:`<p><b>Forward rate:</b> the rate for a future period that today's zero rates lock in. If 1 year pays 3% and 2 years pays 4%, the second year alone must pay 5% (continuous rates).</p>
 <p><b>Duration</b> is the weighted average time you wait for your cash, where the weights are each payment's share of the price. It is also the sensitivity: a 1% rise in yield cuts the price by about D%.</p>
 <p><b>Convexity:</b> the price-yield curve is bowed. A straight-line (duration) estimate always <i>underestimates</i> the price after a big move either way. Full repricing is the true answer; duration is the quick estimate.</p>`,
 formula:'Forward rate:   F(T1,T2) = (R2·T2 − R1·T1) / (T2 − T1)\nDuration:       D = Σ t × [CF(t)·e^(−y·t)] / B\nPrice change:   ΔB ≈ −B × D × Δy  (+ ½ × B × C × Δy²)',
 legend:'R = zero rates, y = bond yield (continuous), B = bond price, C = convexity.',
 ex:{q:'3-year bond, 10% coupon paid twice a year, yield 12% continuous (Hull\'s example). Price, duration, and the effect of a 0.1% rise in yield?',
  steps:['Cash flows: $5 at 0.5, 1, 1.5, 2, 2.5 years and $105 at 3 years.','Discount each at e^(−0.12t) and add: <code>B = 94.213</code>','Weight each time by its share of the price and add: <code>D = 2.653 years</code>','ΔB ≈ −94.213 × 2.653 × 0.001 = <code>−0.250</code>, so the price falls to about 93.963.'],
  a:'B = 94.21, D = 2.653, price drops about $0.25'},
 traps:['Using Δy = 0.1 instead of 0.001.','Forgetting the minus sign: rates up means price down.','Using duration for a large rate shock without the convexity term.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_06_Lecture_05_Duration_and_Swaps.pptx','Risk syllabus RMN2 (duration, convexity, term structure)'],
 sketch:{caps:['The price of the bond at each yield. It slopes down and bends (is "convex").','At today\'s yield of 12%, the price is $94.21.','Duration draws the tangent line at that point. Slope = −B × D.','The tangent is below the curve on both sides. That gap is convexity.','For a small move the line is close. For a big move, add the convexity term or reprice fully.'],
  draw:()=>{const cf=[[.5,5],[1,5],[1.5,5],[2,5],[2.5,5],[3,105]],B=y=>cf.reduce((s,[t,c])=>s+c*Math.exp(-y*t),0);
   const f=F(90,30,470,230,0.04,0.2,82,118);const b0=B(0.12),D=2.653;
   let it=[[0,axes(f,'yield','bond price',[0.06,0.12,0.18],[85,95,105],v=>(v*100).toFixed(0)+'%',v=>'$'+v)+P(fp(f,B,0.045,0.2),'sb')]];
   it.push([1,C(f.sx(0.12),f.sy(b0),7,'fp')+T(f.sx(0.12)+12,f.sy(b0)-10,'$94.21 at 12%','mono')]);
   it.push([2,P(fp(f,y=>b0-b0*D*(y-0.12),0.055,0.185,2),'sp')+T(f.sx(0.065),f.sy(b0-b0*D*(0.065-0.12))-14,'duration line','tp mono')]);
   const ff=f;let shade=`M${ff.sx(0.06)},${ff.sy(B(0.06))}`;for(let y=0.06;y<=0.18;y+=0.005)shade+=`L${ff.sx(y)},${ff.sy(B(y))}`;for(let y=0.18;y>=0.06;y-=0.005)shade+=`L${ff.sx(y)},${ff.sy(b0-b0*D*(y-0.12))}`;
   it.push([3,`<path d="${shade}Z" class="fsoftg"/>`+T(f.sx(0.165),f.sy(88),'convexity gap','tg mono')]);
   it.push([4,R(330,40,240,52,'fh')+T(450,62,'ΔB ≈ −B·D·Δy','mono','text-anchor="middle"')+T(450,82,'+ ½·B·C·Δy²','mono','text-anchor="middle"')]);return it}}},

{wk:'Week 2 · Nov 7 – 13',tag:'Derivatives',title:'Swaps: trading payment streams',
 one:'In an interest rate swap, one side <mark>pays fixed and receives floating</mark>. You value it as owning one bond and owing another.',
 plain:`<p>Company A has a floating-rate loan but wants a fixed payment. It enters a swap: pays a fixed 3% to the bank, receives the floating rate back. Only interest moves; the notional (e.g. $100m) never changes hands in an interest rate swap.</p>
 <ul><li><b>Bond view:</b> receive floating + pay fixed = long a floating bond, short a fixed bond. Value = B<sub>float</sub> − B<sub>fixed</sub>.</li>
 <li>Right after a reset, a floating bond is worth its par value (100).</li>
 <li><b>Forward view:</b> treat each future exchange as a forward rate agreement and add them up. Both views give the same answer.</li>
 <li><b>Currency swap:</b> swap interest <i>and</i> principal in two currencies. Value each leg in its own currency, convert at today\'s spot rate.</li></ul>`,
 formula:'Pay fixed, receive floating:   V = B_float − B_fixed\nB_fixed = Σ c·e^(−r_i·t_i) + L·e^(−r_n·t_n)\nB_float = L  (just after a reset)',
 legend:'L = notional, c = fixed coupon payment, r_i = zero rate for time t_i.',
 ex:{q:'$100m swap, 2 years left, you pay 3% fixed annually and receive floating (just reset). Zero rates: 1-yr 2.5%, 2-yr 3.0% (continuous). Value to you?',
  steps:['Fixed bond: 3 × e^(−0.025) + 103 × e^(−0.06)','= 2.926 + 97.001 = <code>99.928</code> ($m)','Floating bond right after reset = <code>100</code>','Value = 100 − 99.928 = <code>+0.072</code> ($m). Positive: the 3% you pay is a little below the fair swap rate for this curve (about 3.04%), so the swap is slightly in your favour.'],
  a:'Swap worth about +$72,000 to the fixed payer'},
 traps:['Getting the sign backwards. Write which side you are on first.','Forgetting the notional at the end of the fixed bond (103, not 3).','For currency swaps, converting with forward rates in the bond view. Use spot.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_06_Lecture_05_Duration_and_Swaps.pptx','Derivatives/04 Assignments and Solutions/FRE6073_ASSIGNMENT_05_Assignment_03.pdf'],
 sketch:{caps:['Two parties: Company A and a bank.','A pays the bank a fixed 3% of $100m every year: $3m.','The bank pays A the floating rate (e.g. SOFR) on $100m.','Same as A owning a floating bond (worth 100) and owing a fixed bond (worth 99.93).','Swap value to A = 100 − 99.93 = +0.07 ($m).'],
  draw:()=>{let it=[[0,R(60,90,150,80,'fs')+T(135,136,'Company A','big','text-anchor="middle"')+R(430,90,150,80,'fs')+T(505,136,'Bank','big','text-anchor="middle"')]];
   it.push([1,AR(215,110,425,110,'sp')+T(320,100,'fixed 3% = $3m','tp mono','text-anchor="middle"')]);
   it.push([2,AR(425,152,215,152,'sb')+T(320,175,'floating (SOFR)','tb mono','text-anchor="middle"')]);
   const f=F(150,215,300,90,0,1,95,101);
   it.push([3,R(170,f.sy(100),80,f.sy(95)-f.sy(100),'fb',3)+T(210,f.sy(100)-6,'float 100','mono','text-anchor="middle"')+R(350,f.sy(99.93),80,f.sy(95)-f.sy(99.93),'fp',3)+T(390,f.sy(99.93)-6,'fixed 99.93','mono','text-anchor="middle"')+T(300,f.sy(97),'−','big','text-anchor="middle"')]);
   it.push([4,R(470,250,150,46,'fh')+T(545,280,'= +0.07','big','text-anchor="middle"')]);return it}}},

{wk:'Week 2 · Nov 7 – 13',tag:'Risk',title:'Volatility, diversification, VaR and ES',
 one:'VaR answers "<mark>how bad is a bad day</mark>?" Expected Shortfall answers "and if it gets worse than that, how bad on average?"',
 plain:`<ul><li><b>Volatility (σ):</b> the standard deviation of returns. Bigger σ = wider swings.</li>
 <li><b>Diversification:</b> two assets that don't move together have a portfolio σ <i>below</i> the average of their σs. Correlation ρ controls how much.</li>
 <li><b>VaR at 99%:</b> the loss you will not exceed on 99 out of 100 days. For a normal distribution it is 2.326 × σ.</li>
 <li><b>Expected Shortfall (ES):</b> the average loss on the worst 1% of days. Always bigger than VaR, and it sees how fat the tail is. Regulators now prefer ES.</li></ul>`,
 formula:'Portfolio variance: σp² = w1²σ1² + w2²σ2² + 2·w1·w2·ρ·σ1·σ2\nNormal VaR:  VaR = z × σ × Value      (z = 1.645 at 95%, 2.326 at 99%)\nNormal ES:   ES  = σ × Value × φ(z) / (1 − confidence)',
 legend:'w = weights, ρ = correlation, φ = the normal bell-curve height.',
 ex:{q:'A $10m portfolio has a daily σ of 2%. Find the 99% 1-day VaR and ES. Then: 60/40 in two assets with σ = 20% and 30%, ρ = 0.3. Portfolio σ?',
  steps:['Daily $σ = 0.02 × 10m = <code>$200,000</code>','VaR = 2.326 × 200,000 = <code>$465,000</code>','ES = 200,000 × φ(2.326)/0.01 = 200,000 × 2.665 = <code>$533,000</code>','σp² = 0.36(0.04) + 0.16(0.09) + 2(0.6)(0.4)(0.3)(0.2)(0.3) = <code>0.03744</code>, σp = <code>19.35%</code>, below the 24% weighted average.'],
  a:'VaR $465k, ES $533k; portfolio σ 19.35%'},
 traps:['Calling VaR the worst possible loss. It is a threshold, not a maximum.','Scaling 1-day VaR to 10 days by 10 instead of √10.','Forgetting the 2·w1·w2 in the variance formula.'],
 files:['Risk/01 Course Information/FRE6123_INFO_01_Syllabus_Fall_2026.docx (RMN1)','Risk lecture decks RMN1–2 are not in your folder yet'],
 calc:{inputs:[['v','Portfolio value ($)',10000000],['s','Daily volatility (%)',2],['c','Confidence (95 or 99)',99],['d','Days',1]],
  run:v=>{const z=v.c>=99?2.3263:1.6449,a=1-(v.c>=99?0.99:0.95),sd=v.v*v.s/100*Math.sqrt(v.d);return `$σ over ${v.d} day(s) = ${f2(sd)}<br>VaR = ${z} × ${f2(sd)} = <b>$${f2(z*sd)}</b><br>ES = ${f2(sd)} × φ(${z})/${a.toFixed(2)} = <b>$${f2(sd*npdf(z)/a)}</b>`}},
 sketch:{caps:['This bell curve is your daily profit and loss. Most days are near zero.','The red sliver on the left is the worst 1% of days.','VaR is where that sliver starts: a loss of $465k.','ES is the average of everything inside the sliver: $533k. Further out than VaR.','Diversification: mixing two assets gives 19.35% risk, less than the 24% average.'],
  draw:()=>{const f=F(60,30,400,230,-4,4,0,0.42);let it=[[0,axes(f,'daily P&L (σ = $200k)','',[-2.326,0,2],[],v=>v===0?'0':v===2?'+$400k':'−$465k')+P(fp(f,npdf,-4,4),'sb')]];
   let sh=`M${f.sx(-4)},${f.sy(0)}`;for(let x=-4;x<=-2.326;x+=0.05)sh+=`L${f.sx(x)},${f.sy(npdf(x))}`;sh+=`L${f.sx(-2.326)},${f.sy(0)}Z`;
   it.push([1,`<path d="${sh}" class="fsoftp"/>`+T(f.sx(-3.95),f.sy(0.05),'worst 1%','tp mono')]);
   it.push([2,L(f.sx(-2.326),f.y+10,f.sx(-2.326),f.sy(0),'sp')+T(f.sx(-2.326)+6,f.y+24,'VaR −$465k','tp mono')]);
   it.push([3,C(f.sx(-2.665),f.sy(0.006),7,'fp')+AR(f.sx(-2.665),f.sy(0.2),f.sx(-2.665),f.sy(0.03),'sp')+T(f.sx(-2.665)-4,f.sy(0.22),'ES −$533k','tp mono','text-anchor="end"')]);
   const g=F(500,60,120,200,0,2,0,30);it.push([4,axes(g,'','risk %',[],[0,10,20,30])+R(g.sx(0.2),g.sy(24),36,g.sy(0)-g.sy(24),'fm',2)+T(g.sx(0.2)+18,g.sy(24)-6,'24%','mono','text-anchor="middle"')+R(g.sx(1.1),g.sy(19.35),36,g.sy(0)-g.sy(19.35),'fg',2)+T(g.sx(1.1)+18,g.sy(19.35)-6,'19.35%','mono tg','text-anchor="middle"')+T(g.sx(0.2)+18,g.y+g.h+16,'avg','tm','text-anchor="middle"')+T(g.sx(1.1)+18,g.y+g.h+16,'mix','tm','text-anchor="middle"')]);return it}}},

{wk:'Week 2 · Nov 7 – 13',tag:'Valuation',title:'Simulation, correlation and Cholesky',
 one:'Simulation means <mark>making up thousands of possible futures</mark> with random numbers and averaging the results. Cholesky is the trick that makes those random numbers move together.',
 plain:`<p>Some problems are too messy for a formula (10 bonds defaulting at different times, a CDO waterfall). So you let the computer roll dice many times and look at the outcomes.</p>
 <ul><li><b>Uniform U</b> (between 0 and 1) → <b>normal Z</b> with NORM.S.INV(U) in Excel.</li>
 <li><b>Correlation:</b> independent Z's don't move together. To get correlation ρ, mix them: X2 = ρ·Z1 + √(1−ρ²)·Z2. For many variables, the Cholesky matrix does this mixing for all of them at once.</li>
 <li><b>Default time:</b> with a constant default rate λ, a random default time is τ = −ln(U)/λ. If τ is before maturity, that bond defaults in this run.</li>
 <li><b>Sanity checks:</b> the sample mean, standard deviation and correlation should match what you asked for. "Moment matching" forces them to match exactly.</li></ul>`,
 formula:'Two variables:   X1 = Z1\n                 X2 = ρ·Z1 + √(1 − ρ²)·Z2\nMany variables:  X = L·Z   where  L·Lᵀ = correlation matrix\nDefault time:    τ = −ln(U) / λ',
 legend:'Z = independent standard normals, L = Cholesky (lower triangular) matrix, λ = default intensity per year.',
 ex:{q:'ρ = 0.6, and you drew Z1 = 1.2, Z2 = −0.5. Find X1 and X2. Then: λ = 4% a year and U = 0.7. When does the bond default?',
  steps:['X1 = Z1 = <code>1.2</code>','√(1 − 0.36) = <code>0.8</code>','X2 = 0.6 × 1.2 + 0.8 × (−0.5) = 0.72 − 0.40 = <code>0.32</code>','τ = −ln(0.7)/0.04 = 0.3567/0.04 = <code>8.92 years</code>. For a 5-year bond: no default in this run.'],
  a:'X1 = 1.2, X2 = 0.32; default at 8.92 years'},
 traps:['Using a covariance matrix when the formula needs a correlation matrix (or the other way round).','Re-drawing random numbers every time Excel recalculates. Fix them (paste values) so results are comparable.','Forgetting to check that sample correlation is near the target.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_05_Lecture_4_Simulation.pdf','Valuation/04 Spreadsheets and Data/FRE6103_DATA_02_Lecture_4_Cholesky_five.xlsx','Valuation/04 Spreadsheets and Data/FRE6103_DATA_03_Lecture_4_Simulation_spreadsheets.xlsx'],
 sketch:{caps:['400 pairs of independent random numbers. A round cloud: knowing one tells you nothing about the other.','Apply Cholesky with ρ = 0.6. The cloud stretches into a tilted oval. Now they move together.','One dot: (Z1, Z2) = (1.2, −0.5) becomes (1.2, 0.32). It moved up because Z1 was high.','Default times: draw U, then τ = −ln(U)/λ. Small U means a long wait; big U means early default.'],
  draw:()=>{const r=rng(7),pts=[];for(let i=0;i<400;i++)pts.push([gauss(r),gauss(r)]);const a=F(40,40,240,220,-3.2,3.2,-3.2,3.2),b=F(360,40,240,220,-3.2,3.2,-3.2,3.2);
   let d1='',d2='';pts.forEach(([x,y])=>{if(Math.abs(x)>3.1||Math.abs(y)>3.1||Math.abs(0.6*x+0.8*y)>3.1)return;d1+=C(a.sx(x).toFixed(1),a.sy(y).toFixed(1),2.2,'fb');const y2=0.6*x+0.8*y;d2+=C(b.sx(x).toFixed(1),b.sy(y2).toFixed(1),2.2,'fp')});
   let it=[[0,R(a.x,a.y,a.w,a.h,'fs',4)+d1+T(a.x,a.y-10,'independent (ρ = 0)','big','style="font-size:16px"')]];
   it.push([1,R(b.x,b.y,b.w,b.h,'fs',4)+d2+T(b.x,b.y-10,'after Cholesky (ρ = 0.6)','big','style="font-size:16px"')]);
   it.push([2,C(a.sx(1.2),a.sy(-0.5),7,'fh')+C(b.sx(1.2),b.sy(0.32),7,'fh')+AR(a.sx(1.2)+10,a.sy(-0.5),b.sx(1.2)-10,b.sy(0.32),'s')+T(320,300,'(1.2, −0.5) → (1.2, 0.32)','mono','text-anchor="middle"')]);
   it.push([3,R(1,1,638,338,'fs',0)+(()=>{const g=F(100,70,440,170,0.02,1,0,60);return axes(g,'U (random 0–1)','default time τ (yrs)',[0.1,0.5,0.7,1],[0,20,40,60])+P(fp(g,u=>-Math.log(u)/0.04,0.091,1),'sp')+C(g.sx(0.7),g.sy(8.92),6,'fh')+T(g.sx(0.7)+8,g.sy(8.92)-12,'U=0.7 → 8.92 yrs','mono')+L(g.x,g.sy(5),g.x+g.w,g.sy(5),'sb dash')+T(g.x+g.w,g.sy(5)-6,'5-yr maturity','tb mono','text-anchor="end"')})()]);return it}}},

{wk:'Week 2 · Nov 7 – 13',tag:'Valuation + Derivatives',title:'Random walks and stock price paths',
 one:'A stock price is modelled as <mark>a steady drift plus random shocks</mark>. Using percentage shocks (geometric Brownian motion) keeps prices positive and gives a lognormal shape.',
 plain:`<ul><li><b>Wiener process (Brownian motion) W:</b> a random walk where each tiny step is normal with variance equal to the time step. Over time Δt the change is ε√Δt.</li>
 <li><b>Arithmetic Brownian motion:</b> dX = μ dt + σ dW. Can go negative. Fine for spreads or rates, not for stock prices.</li>
 <li><b>Geometric Brownian motion (GBM):</b> dS = μS dt + σS dW. Returns are normal, prices are lognormal.</li>
 <li><b>Simulating one step exactly:</b> S<sub>next</sub> = S × exp((μ − σ²/2)Δt + σ√Δt·Z). The −σ²/2 is there because of Itô's lemma; without it your average would be too high.</li>
 <li><b>Mean reversion</b> (e.g. rates, commodities): the drift pulls the value back toward a long-run level.</li></ul>`,
 formula:'GBM:          dS = μ·S·dt + σ·S·dW\nOne step:     S(t+Δt) = S(t) × exp[(μ − σ²/2)·Δt + σ·√Δt·Z]\nExpected:     E[S_T] = S0 × e^(μT)',
 legend:'μ = expected return (drift), σ = volatility, Z = standard normal draw.',
 ex:{q:'S = 100, μ = 8%, σ = 20%, Δt = 1 year, and you draw Z = 0.5. What is the simulated price?',
  steps:['Drift part: (0.08 − 0.02) × 1 = <code>0.06</code>','Shock part: 0.20 × √1 × 0.5 = <code>0.10</code>','Add: 0.16, then <code>e^0.16 = 1.1735</code>','S = 100 × 1.1735 = <code>117.35</code>'],
  a:'S = $117.35'},
 traps:['Forgetting −σ²/2 in the exponent.','Using σ × Δt instead of σ × √Δt.','Mixing up the median (S0·e^((μ−σ²/2)T)) and the mean (S0·e^(μT)).'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_06_Lecture_5_Stochastic_Processes.pdf','Valuation/04 Spreadsheets and Data/FRE6103_DATA_05_Lecture_5_Simulation_spreadsheets.xlsx','Hull 8e, Chapter 13 (Wiener processes and Itô)'],
 sketch:{caps:['Start at $100. Time runs left to right over one year.','One simulated path: small random up and down steps with a slight upward drift.','More paths. Each one is a possible future.','The blue line is the average path, 100·e^(0.08t). The band shows the typical spread, which widens over time.','At year end the prices pile up in a lopsided (lognormal) shape: a long tail upward, never below zero.'],
  draw:()=>{const f=F(70,30,420,250,0,1,50,170),r=rng(11),n=60,paths=[];for(let p=0;p<7;p++){let s=100,pt=[[0,100]];for(let k=1;k<=n;k++){s*=Math.exp((0.08-0.02)/n+0.2*Math.sqrt(1/n)*gauss(r));pt.push([k/n,s])}paths.push(pt)}
   const pd=pt=>pt.map(([t,s],i)=>(i?'L':'M')+f.sx(t).toFixed(1)+','+f.sy(Math.min(168,Math.max(52,s))).toFixed(1)).join('');
   let it=[[0,axes(f,'time (years)','price',[0,0.5,1],[60,100,140],v=>v,v=>'$'+v)+C(f.sx(0),f.sy(100),6,'fb')]];
   it.push([1,P(pd(paths[0]),'s')]);it.push([2,paths.slice(1).map(p=>P(pd(p),'sm')).join('')]);
   let band=`M${f.sx(0)},${f.sy(100)}`;for(let t=0;t<=1;t+=0.05)band+=`L${f.sx(t)},${f.sy(100*Math.exp(0.06*t+0.2*Math.sqrt(t)))}`;for(let t=1;t>=0;t-=0.05)band+=`L${f.sx(t)},${f.sy(100*Math.exp(0.06*t-0.2*Math.sqrt(t)))}`;
   it.push([3,`<path d="${band}Z" class="fsoftb"/>`+P(fp(f,t=>100*Math.exp(0.08*t),0,1),'sb')]);
   const ln=s=>Math.exp(-Math.pow(Math.log(s/100)-0.06,2)/(2*0.04))/(s*0.2*Math.sqrt(2*Math.PI));let hd=`M${f.x+f.w+4},${f.sy(52)}`;for(let s=52;s<=168;s+=2)hd+=`L${f.x+f.w+4+ln(s)*4200},${f.sy(s)}`;
   it.push([4,P(hd,'sp')+T(f.x+f.w+40,f.sy(150),'lognormal','tp mono')]);return it}}},

/* ===== WEEK 3 ===== */
{wk:'Week 3 · Nov 14 – 20',tag:'Valuation',title:'Portfolio theory and the CAPM',
 one:'Investors only get paid for risk they <mark>cannot diversify away</mark>. Beta measures that risk, and the CAPM turns beta into a required return.',
 plain:`<ul><li><b>Efficient frontier:</b> the best possible return for each level of risk, built by mixing stocks (Markowitz). Correlation below 1 bends it to the left.</li>
 <li><b>Capital market line:</b> mix the risk-free asset with the best risky portfolio (the "market" M). It is the line from r<sub>f</sub> that just touches the frontier. Its slope is the Sharpe ratio.</li>
 <li><b>Beta:</b> how much an asset moves when the market moves. β = Cov(r<sub>i</sub>, r<sub>M</sub>)/Var(r<sub>M</sub>).</li>
 <li><b>CAPM:</b> E[r] = r<sub>f</sub> + β × (E[r<sub>M</sub>] − r<sub>f</sub>).</li>
 <li><b>Lintner (certainty-equivalent) form:</b> value a risky cash flow X by subtracting a risk charge, then discounting at the risk-free rate. This is how the course values CDO tranches.</li></ul>`,
 formula:'Sharpe ratio:  (E[r] − rf) / σ\nCAPM:          E[r_i] = rf + β_i × (E[r_M] − rf)\nLintner:       PV = (E[X] − λ·Cov(X, r_M)) / (1 + rf)\n               λ = (E[r_M] − rf) / σ_M²',
 legend:'λ = market price of risk, X = an uncertain cash flow in one period.',
 ex:{q:'rf = 4%, market return 10%, σ_M = 20%. (a) Required return for β = 1.2? (b) A cash flow has E[X] = $110 and Cov(X, r_M) = 2. Value it with Lintner.',
  steps:['(a) 4% + 1.2 × (10% − 4%) = <code>11.2%</code>','(b) λ = 0.06 / 0.04 = <code>1.5</code>','Risk charge = 1.5 × 2 = <code>3</code>, certainty equivalent = 110 − 3 = 107','PV = 107 / 1.04 = <code>102.88</code>'],
  a:'Required return 11.2%; PV = $102.88'},
 traps:['Using total risk σ instead of beta for required return.','Discounting the certainty equivalent at a risky rate. It already includes the risk charge, so use rf.','Forgetting that correlation, not volatility alone, drives diversification.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_07_Lecture_6_MPT_and_the_CAPM.pdf','Valuation/04 Spreadsheets and Data/FRE6103_DATA_06_MPT_Ten_Stock_Portfolio.xlsx','Valuation/04 Spreadsheets and Data/FRE6103_DATA_07_sharpe_and_lintner.xlsx'],
 sketch:{caps:['Each dot is one stock: its risk (σ) and expected return.','Mixing them gives the efficient frontier: the best return for each level of risk.','Add the risk-free asset at 4%. Draw a line from it that just touches the frontier.','The touching point is the market portfolio M. Everyone should hold a mix of M and the risk-free asset.','For one asset, CAPM says: required return = 4% + β × 6%.'],
  draw:()=>{const f=F(80,30,470,240,0,0.4,0,0.18),sg=m=>Math.sqrt(0.0144+Math.pow((m-0.08)/0.5,2));
   let best=0,bm=0;for(let m=0.08;m<0.2;m+=0.0005){const s=(m-0.04)/sg(m);if(s>best){best=s;bm=m}}
   let it=[[0,axes(f,'risk σ','expected return',[0.1,0.2,0.3,0.4],[0.04,0.08,0.12,0.16],v=>(v*100)+'%',v=>(v*100).toFixed(0)+'%')]];
   const st=[[0.22,0.07],[0.3,0.12],[0.25,0.1],[0.35,0.14],[0.18,0.06],[0.28,0.08],[0.33,0.11]];it[0][1]+=st.map(([s,m])=>C(f.sx(s),f.sy(m),5,'fm')).join('');
   it.push([1,P((()=>{let d='';for(let m=0.02;m<=0.17;m+=0.002)d+=(d?'L':'M')+f.sx(sg(m)).toFixed(1)+','+f.sy(m).toFixed(1);return d})(),'sb')+T(f.sx(0.19),f.sy(0.02),'efficient frontier','tb mono')]);
   it.push([2,C(f.sx(0),f.sy(0.04),6,'fg')+T(f.sx(0)+8,f.sy(0.04)+18,'rf 4%','tg mono')+P(`M${f.sx(0)},${f.sy(0.04)}L${f.sx(Math.min(0.4,0.135/best))},${f.sy(0.04+best*Math.min(0.4,0.135/best))}`,'sg')+T(f.sx(0.02),f.sy(0.04+best*0.06)-14,'CML','tg mono')]);
   it.push([3,C(f.sx(sg(bm)),f.sy(bm),8,'fh')+T(f.sx(sg(bm))+12,f.sy(bm)+18,'M (market)','big','style="font-size:16px"')]);
   it.push([4,R(330,240,290,44,'fh')+T(475,268,'E[r] = 4% + β × 6%','big','text-anchor="middle"')]);return it}}},

{wk:'Week 3 · Nov 14 – 20',tag:'Risk + Valuation',title:'Credit risk: default, loss and spreads',
 one:'Expected credit loss is <mark>chance of default × share you lose × amount at stake</mark>. A credit spread is the extra yield lenders demand to cover that.',
 plain:`<ul><li><b>PD</b> (probability of default), <b>LGD</b> (loss given default = 1 − recovery rate), <b>EAD</b> (exposure at default).</li>
 <li><b>Hazard rate λ:</b> the default "speed". Survival to time t is e<sup>−λt</sup>; PD by t is 1 − e<sup>−λt</sup>.</li>
 <li><b>Credit spread ≈ λ × LGD.</b> A CDS (credit default swap) is insurance on a bond, and its spread works out to about the same number.</li>
 <li><b>P vs Q:</b> real-world (P) default probabilities come from history. Risk-neutral (Q) ones come from prices and are higher, because they include a risk premium.</li>
 <li><b>Expected loss</b> is a cost you price in. <b>Unexpected loss</b> is what capital must absorb.</li></ul>`,
 formula:'Survival:      S(t) = e^(−λt)        PD(t) = 1 − e^(−λt)\nExpected loss: EL = PD × LGD × EAD\nSpread:        s ≈ λ × LGD   →   λ ≈ s / (1 − R)',
 legend:'λ = hazard rate per year, R = recovery rate.',
 ex:{q:'A borrower has λ = 2% a year. LGD = 60%. Exposure $1m. Find 5-year survival, 5-year PD, 1-year expected loss and the spread.',
  steps:['Survival 5y = e^(−0.02 × 5) = e^(−0.1) = <code>90.48%</code>','PD 5y = 1 − 0.9048 = <code>9.52%</code>','1-year PD ≈ 1 − e^(−0.02) = 1.98%, EL ≈ 0.0198 × 0.6 × 1,000,000 = <code>$11,900</code>','Spread ≈ 0.02 × 0.6 = <code>1.2%</code> = 120 basis points'],
  a:'Survival 90.48%, PD 9.52%, EL ≈ $11.9k, spread ≈ 120 bp'},
 traps:['Using recovery rate where LGD is needed (or the reverse).','Adding PDs across years instead of using survival.','Mixing P and Q probabilities in the same calculation.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_10_Lecture_03_Corporate_Bonds_and_CDOs.pdf','Risk syllabus RMN5–6 (PD, LGD, CDS, CVA)','Hull 8e, Chapter 23 (Credit risk)'],
 sketch:{caps:['The chance a borrower is still alive (not defaulted) over time.','With λ = 2% a year, survival slides slowly down: e^(−0.02t).','At 5 years, 90.48% survive. So 9.52% have defaulted.','Expected loss stacks three things: $1m at stake × 60% lost × 1.98% chance = $11.9k.','The lender wants about λ × LGD = 1.2% extra yield to cover this.'],
  draw:()=>{const f=F(70,30,300,230,0,10,0.6,1);let it=[[0,axes(f,'years','survival',[0,5,10],[0.6,0.8,1],v=>v,v=>(v*100)+'%')]];
   it.push([1,P(fp(f,t=>Math.exp(-0.02*t),0,10),'sb')+P(fp(f,t=>Math.exp(-0.05*t),0,10),'sm dash')+T(f.sx(10),f.sy(Math.exp(-0.5))-8,'λ=5%','tm','text-anchor="end"')+T(f.sx(10),f.sy(Math.exp(-0.2))-8,'λ=2%','tb mono','text-anchor="end"')]);
   it.push([2,L(f.sx(5),f.sy(0.6),f.sx(5),f.sy(0.9048),'sp dash')+C(f.sx(5),f.sy(0.9048),6,'fp')+T(f.sx(5)+8,f.sy(0.9048)+20,'90.48%','tp mono')]);
   it.push([3,R(420,40,180,40,'fs')+T(510,66,'EAD $1,000,000','mono','text-anchor="middle"')+T(510,100,'× LGD 60%','mono','text-anchor="middle"')+R(450,110,120,36,'fs')+T(510,134,'$600,000','mono','text-anchor="middle"')+T(510,168,'× PD 1.98%','mono','text-anchor="middle"')+R(470,178,80,36,'fh')+T(510,202,'$11,900','mono','text-anchor="middle"')]);
   it.push([4,R(400,240,220,44,'fh')+T(510,268,'spread ≈ 1.2%','big','text-anchor="middle"')]);return it}}},

{wk:'Week 3 · Nov 14 – 20',tag:'Valuation',title:'CDO waterfalls and tranches',
 one:'A CDO pools many bonds and pays the cash out <mark>in order</mark>: senior tranche first, then junior, then whatever is left goes to equity. Who gets hurt depends on how many bonds default.',
 plain:`<ul><li><b>Collateral:</b> the pool of bonds (Mini Project 3: ten $10m bonds, 6% coupons).</li>
 <li><b>Waterfall:</b> each period, pay tranche A what it is owed, then B, then the residual. No carry-forwards in the project version.</li>
 <li><b>Senior (A)</b> is safest; it only loses if many bonds default. <b>Equity/residual</b> takes the first losses.</li>
 <li><b>Correlation matters:</b> with high correlation, bonds tend to default together. That makes "almost nothing" and "lots" of defaults both likelier. Senior tranches get <i>riskier</i>; equity can get <i>safer</i>.</li>
 <li>Value each tranche by simulating cash flows (Class 11) and pricing them with Lintner (Class 13).</li></ul>`,
 formula:'Pay A = min(cash, owed to A)\nPay B = min(cash − Pay A, owed to B)\nResidual = cash − Pay A − Pay B',
 legend:'Repeat every period in every simulation run, then average and discount.',
 ex:{q:'This period A is owed $3m and B is owed $2m. The pool pays (a) $6m, (b) $4m, (c) $2m. Who gets what?',
  steps:['(a) $6m: A gets 3, B gets 2, residual gets <code>1</code>','(b) $4m: A gets 3, B gets <code>1</code> (short by 1), residual 0','(c) $2m: A gets <code>2</code> (short by 1), B 0, residual 0','So the residual is hit first, then B, and A only in bad cases.'],
  a:'(a) 3/2/1 (b) 3/1/0 (c) 2/0/0'},
 traps:['Paying tranches pro rata instead of in order.','Forgetting LGD: a defaulted bond still pays its recovery.','Assuming correlation always makes every tranche riskier.'],
 files:['Valuation/07 Earlier Midterm Materials/FRE6103_REVIEW_04_Mini_Project_3_CDO_Risk_Part_1_Instructions.txt','Valuation/06 Project and Recording Notes/FRE6103_NOTES_01_Project_and_recording_notes.md','Valuation/03 Lectures/FRE6103_LECTURE_10_Lecture_03_Corporate_Bonds_and_CDOs.pdf'],
 sketch:{caps:['Three buckets stacked like a fountain: A on top, B in the middle, residual at the bottom. Cash pours in from the pool.','Good period: the pool pays $6m. A fills ($3m), B fills ($2m), $1m spills into the residual.','Some defaults: only $4m. A fills, B gets $1m of its $2m, residual gets nothing.','Many defaults: $2m. Even A comes up short. B and residual get nothing.','Rule: losses hit from the bottom up. Senior is protected by everyone below it.'],
  draw:()=>{const bk=[['A (senior)',3,60],['B (junior)',2,150],['Residual',2,240]],sc=[null,[3,2,1],[3,1,0],[2,0,0],null],pay=[null,6,4,2,null];
   const base=()=>bk.map(([n,c,y])=>R(260,y,180,c*22,'fs',4)+T(250,y+c*11+5,n,'big','style="font-size:16px" text-anchor="end"')+T(450,y+c*11+5,n==='Residual'?'whatever is left':'owed $'+c+'m','tm')).join('');
   let it=[[[0,4],base()],[0,AR(120,30,250,60,'sb')+T(40,26,'cash from pool','tb mono')]];
   for(let s=1;s<=3;s++){let g=T(40,60,'pool pays $'+pay[s]+'m','big tb')+L(350,60+66,350,150,'sb dash')+L(350,150+44,350,240,'sb dash');
    bk.forEach(([n,c,y],i)=>{const v=sc[s][i],h=Math.min(v,c)*22;if(v>0)g+=R(262,y+c*22-h,176,h,'fb',3);g+=T(560,y+c*11+5,'$'+v+'m','mono '+(v<(i<2?c:1)&&i<2?'tp':'tg'),'text-anchor="middle"')});it.push([[s,s],g])}
   it.push([[4,4],R(160,296,320,36,'fh')+T(320,320,'losses hit bottom → top','mono','text-anchor="middle"')]);return it}}},

{wk:'Week 3 · Nov 14 – 20',tag:'Derivatives',title:'Binomial trees for options',
 one:'Let the stock only go <mark>up or down</mark> each step. Then you can copy the option exactly with stock and cash, and that copy\'s cost is the option price.',
 plain:`<ul><li><b>Replication:</b> hold Δ shares and borrow some cash so the portfolio pays the same as the option in both the up and down state. Δ = (f<sub>u</sub> − f<sub>d</sub>)/(S<sub>u</sub> − S<sub>d</sub>).</li>
 <li><b>Risk-neutral probability p:</b> the made-up probability that makes the stock earn the risk-free rate. It is a pricing tool, not anyone's real forecast.</li>
 <li><b>Backward induction:</b> start at the end with payoffs, step back one node at a time: value = e<sup>−rΔt</sup>[p·f<sub>u</sub> + (1−p)·f<sub>d</sub>].</li>
 <li><b>American options:</b> at each node, value = max(hold value, exercise now). Matters most for puts.</li>
 <li>With many small steps the tree converges to Black-Scholes (Class 17). Typical choice: u = e<sup>σ√Δt</sup>, d = 1/u.</li></ul>`,
 formula:'p = (e^(rΔt) − d) / (u − d)\nf = e^(−rΔt) × [p·f_u + (1 − p)·f_d]\nΔ = (f_u − f_d) / (S·u − S·d)\nAmerican: f = max(f, exercise value)',
 legend:'u, d = up and down factors, Δt = length of one step, f = option value at a node.',
 ex:{q:'Stock $20, u = 1.1, d = 0.9, r = 12%, each step is 3 months. Price a European call with strike $21: one step, then two steps.',
  steps:['p = (e^(0.12×0.25) − 0.9) / 0.2 = (1.0305 − 0.9)/0.2 = <code>0.6523</code>','One step: up price 22 → payoff 1; down 18 → payoff 0. c = e^(−0.03) × 0.6523 × 1 = <code>0.633</code> (Δ = 1/4 = 0.25 shares)','Two steps: ends 24.2, 19.8, 16.2 → payoffs 3.2, 0, 0','Up node: e^(−0.03) × 0.6523 × 3.2 = <code>2.0257</code>; down node = 0','Today: e^(−0.03) × 0.6523 × 2.0257 = <code>1.2822</code>'],
  a:'One-step call = $0.633; two-step call = $1.2822'},
 traps:['Using the real-world probability instead of p.','Discounting by the whole T at each step instead of Δt.','For American puts, forgetting to compare with early exercise at every node.'],
 files:['Derivatives/03 Lectures/FRE6073_LECTURE_01_Binomial_trees.pdf','Hull 8e, Chapter 12'],
 calc:{inputs:[['s','Stock S',20],['u','Up factor u',1.1],['d','Down factor d',0.9],['r','Rate r (%)',12],['t','Step length (years)',0.25],['k','Strike K',21]],
  run:v=>{const g=Math.exp(v.r/100*v.t),p=(g-v.d)/(v.u-v.d),fu=Math.max(v.s*v.u-v.k,0),fd=Math.max(v.s*v.d-v.k,0),c=(p*fu+(1-p)*fd)/g,de=(fu-fd)/(v.s*(v.u-v.d)),pu=Math.max(v.k-v.s*v.u,0),pdn=Math.max(v.k-v.s*v.d,0);
   return `p = (${g.toFixed(4)} − ${v.d}) / (${v.u} − ${v.d}) = <b>${f4(p)}</b><br>Call payoffs: up ${f2(fu)}, down ${f2(fd)} → call = <b>${f4(c)}</b>, Δ = ${f4(de)}<br>Put payoffs: up ${f2(pu)}, down ${f2(pdn)} → put = <b>${f4((p*pu+(1-p)*pdn)/g)}</b>`}},
 sketch:{caps:['Today the stock is $20.','After 3 months it is either $22 (up 10%) or $18 (down 10%).','After 6 months: $24.20, $19.80 or $16.20.','At the end, a call with strike $21 pays 3.20, 0, 0.','Step back using p = 0.6523 and discount: 2.03 at the up node, then $1.28 today.'],
  draw:()=>{const N=(x,y,t,sub,c='fs')=>R(x-46,y-24,92,48,c,8)+T(x,y-2,t,'mono','text-anchor="middle"')+(sub?T(x,y+16,sub,'mono tp','text-anchor="middle" style="font-size:12px"'):'');
   let it=[[0,N(90,170,'$20','')]];
   it.push([1,P('M136,160L254,95','s')+P('M136,180L254,245','s')+N(300,90,'$22','')+N(300,250,'$18','')+T(190,112,'p = 0.65','tm')+T(190,240,'1 − p','tm')]);
   it.push([2,P('M346,80L464,40','s')+P('M346,100L464,165','s')+P('M346,240L464,175','s')+P('M346,260L464,300','s')+N(510,40,'$24.20','')+N(510,170,'$19.80','')+N(510,300,'$16.20','')]);
   it.push([3,T(570,44,'3.20','big tp')+T(570,174,'0','big tp')+T(570,304,'0','big tp')]);
   it.push([4,N(300,90,'$22','f = 2.03','fh')+N(300,250,'$18','f = 0','fs')+N(90,170,'$20','f = 1.28','fh')]);return it}}},

{wk:'Week 4 · Nov 21 – 27',tag:'Derivatives + Valuation',title:'Black-Scholes and the Greeks',
 one:'Black-Scholes gives a formula for a European option price from five inputs. The Greeks say <mark>how the price moves when one input moves</mark>.',
 plain:`<p>Idea behind it: hold the option and short Δ shares. Over a tiny instant the randomness cancels, so the hedge must earn the risk-free rate. That gives a PDE whose answer is the formula. Prof. Shimko's "Simpler Option Pricing" lecture reaches the same formula with only college calculus.</p>
 <ul><li><b>Inputs:</b> stock S, strike K, rate r, volatility σ, time T. Note: the expected return μ is <i>not</i> an input.</li>
 <li><b>Delta</b> N(d1): change in option price per $1 move in the stock. Also the hedge ratio.</li>
 <li><b>Gamma:</b> how fast delta changes. High near the strike close to expiry.</li>
 <li><b>Theta:</b> value lost per day as time passes. <b>Vega:</b> change per 1% more volatility. <b>Rho:</b> change per 1% higher rate.</li>
 <li><b>Put-call parity:</b> c + Ke<sup>−rT</sup> = p + S. Use it to check your answer.</li></ul>`,
 formula:'c = S·N(d1) − K·e^(−rT)·N(d2)\np = K·e^(−rT)·N(−d2) − S·N(−d1)\nd1 = [ln(S/K) + (r + σ²/2)·T] / (σ√T)\nd2 = d1 − σ√T\nDelta(call) = N(d1)    Gamma = φ(d1)/(S·σ·√T)    Vega = S·φ(d1)·√T',
 legend:'N = cumulative normal (NORM.S.DIST(x,TRUE) in Excel), φ = normal density.',
 ex:{q:'S = 42, K = 40, r = 10%, σ = 20%, T = 0.5 years (Hull\'s example). Find the call, the put and delta.',
  steps:['σ√T = 0.2 × 0.7071 = <code>0.1414</code>','d1 = [ln(1.05) + (0.10 + 0.02) × 0.5] / 0.1414 = (0.0488 + 0.06)/0.1414 = <code>0.7693</code>','d2 = 0.7693 − 0.1414 = <code>0.6278</code>; N(d1) = 0.7791, N(d2) = 0.7349','c = 42 × 0.7791 − 40 × e^(−0.05) × 0.7349 = <code>4.76</code>','Put by parity: p = 4.76 − 42 + 40e^(−0.05) = <code>0.81</code>. Delta = <code>0.779</code>'],
  a:'Call $4.76, put $0.81, delta 0.78'},
 traps:['Using σ² where σ goes, or forgetting √T.','Using a non-continuous rate in e^(−rT).','Thinking the stock\'s expected return changes the price. It does not.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_12_Simpler_Option_Pricing_Update_2026.pdf','Valuation/03 Lectures/FRE6103_LECTURE_09_Lecture_9_BSM_and_Implied_Densities.pdf','Hull 8e, Chapters 14 and 18'],
 calc:{inputs:[['s','Stock S',42],['k','Strike K',40],['r','Rate r (%)',10],['v','Volatility σ (%)',20],['t','Years T',0.5]],
  run:v=>{const o=bsm(v.s,v.k,v.r/100,v.v/100,v.t),sq=Math.sqrt(v.t);return `d1 = <b>${f4(o.d1)}</b>, d2 = <b>${f4(o.d2)}</b><br>N(d1) = ${f4(Nc(o.d1))}, N(d2) = ${f4(Nc(o.d2))}<br>Call = <b>${f4(o.c)}</b>, Put = <b>${f4(o.p)}</b><br>Delta = ${f4(Nc(o.d1))}, Gamma = ${f4(npdf(o.d1)/(v.s*v.v/100*sq))}, Vega (per 1%) = ${f4(v.s*npdf(o.d1)*sq/100)}`}},
 sketch:{caps:['At expiry a call with strike $40 is worth max(S − 40, 0): a hockey stick.','Before expiry the price is a smooth curve above the stick. The gap is time value.','At S = $42 with 6 months left, Black-Scholes says $4.76.','The slope of the curve there is delta = 0.78. Move the stock $1, the call moves about $0.78.','With 3 months left (dashed) the curve sits lower and hugs the stick. That loss over time is theta. How sharply the curve bends is gamma.'],
  draw:()=>{const f=F(80,30,470,240,25,60,0,22);let it=[[0,axes(f,'stock price S','call value',[30,40,50,60],[0,5,10,15,20],v=>'$'+v)+P(fp(f,s=>Math.max(s-40,0),25,60,70),'s')+T(f.sx(56),f.sy(19),'payoff at expiry','tm','text-anchor="end"')]];
   it.push([1,P(fp(f,s=>Math.min(22,bsm(s,40,0.1,0.2,0.5).c),25,60),'sb')+T(f.sx(33),f.sy(4),'6 months left','tb mono')]);
   const c42=bsm(42,40,0.1,0.2,0.5).c;it.push([2,C(f.sx(42),f.sy(c42),7,'fp')+T(f.sx(42)-10,f.sy(c42)-12,'$4.76','tp mono','text-anchor="end"')]);
   it.push([3,P(fp(f,s=>c42+0.779*(s-42),36,50,2),'sp')+T(f.sx(50)+4,f.sy(c42+0.779*8),'slope = Δ = 0.78','tp mono')]);
   it.push([4,P(fp(f,s=>Math.min(22,bsm(s,40,0.1,0.2,0.25).c),25,60),'sg dash')+T(f.sx(46),f.sy(3),'3 months left','tg mono')]);return it}}},

{wk:'Week 4 · Nov 21 – 27',tag:'Valuation',title:'Volatility smiles and implied densities',
 one:'If you back out σ from real option prices, it is <mark>not the same for every strike</mark>. That pattern tells you what the market really thinks future prices look like.',
 plain:`<ul><li><b>Implied volatility:</b> the σ you plug into Black-Scholes to match a market price. Solve it with Goal Seek.</li>
 <li><b>Smile / skew:</b> plot implied vol against strike. For stocks, low strikes usually have higher vol (a skew): crashes are feared more than the lognormal model allows.</li>
 <li><b>Volatility surface:</b> implied vol across strike <i>and</i> maturity.</li>
 <li><b>Implied density (Breeden-Litzenberger):</b> the second derivative of call price with respect to strike gives the market's risk-neutral probability density. In practice: a butterfly spread.</li>
 <li><b>European vs Asian:</b> an Asian option pays on the average price, which is less volatile, so it is cheaper. It usually needs simulation.</li></ul>`,
 formula:'Implied density:  q(K) = e^(rT) × ∂²C/∂K²\nButterfly approx: q(K) ≈ e^(rT) × [C(K−h) − 2·C(K) + C(K+h)] / h²',
 legend:'C(K) = call price at strike K, h = gap between strikes.',
 ex:{q:'Calls cost 8.00, 5.00 and 2.80 at strikes 95, 100, 105. Estimate the probability density at 100 (ignore discounting). Roughly what is the chance S_T ends between 97.5 and 102.5?',
  steps:['Butterfly cost: 8.00 − 2 × 5.00 + 2.80 = <code>0.80</code>','Divide by h² = 25: density ≈ <code>0.032</code> per $1','Over a $5 window: 0.032 × 5 = <code>0.16</code>','So about a 16% risk-neutral chance of ending near $100.'],
  a:'Density ≈ 0.032 per $; about 16% chance'},

{wk:'Weeks 5–6 · Nov 28 – Dec 11',tag:'Valuation + Risk',title:'Real options and the Merton model',
 one:'Choices in a business (wait, expand, abandon) are <mark>options</mark>, so they have value that plain NPV misses. Even a company\'s stock is an option on its assets.',
 plain:`<ul><li><b>Real option:</b> the right, not the duty, to take a business action later. Waiting lets you invest only if things go well.</li>
 <li>Value it like Class 16: build a tree of the project value, find risk-neutral p, roll back.</li>
 <li>If the option value is bigger than investing now (NPV today), <b>wait</b>.</li>
 <li><b>Energy example (VL14):</b> a power plant is a call on the spread between power and fuel prices: run it only when profitable.</li>
 <li><b>Merton model:</b> equity = call option on the firm's assets with strike = debt. Default happens if assets end below the debt. <b>Distance to default</b> counts how many σ the firm is from that line.</li></ul>`,
 formula:'Risk-neutral p = [V0·(1 + rf) − V_down] / (V_up − V_down)\nOption value   = [p·max(V_up − I, 0) + (1−p)·max(V_down − I, 0)] / (1 + rf)\nMerton:  Equity = V·N(d1) − D·e^(−rT)·N(d2)\n         DD = [ln(V/D) + (μ − σ²/2)T] / (σ√T),   PD = N(−DD)',
 legend:'V = value of project or firm assets, I = investment cost, D = face value of debt.',
 ex:{q:'A project is worth $105 today and costs $100. Next year it will be worth $140 or $80; rf = 5%. Invest now, or keep the right to invest next year (cost still $100)?',
  steps:['NPV now = 105 − 100 = <code>5</code>','p = (105 × 1.05 − 80) / (140 − 80) = 30.25/60 = <code>0.504</code>','Wait: next year invest only if up: payoff 40 or 0','Option value = 0.504 × 40 / 1.05 = <code>19.21</code>. Bigger than 5, so wait.','Merton check: V = 100, D = 80, μ = 6%, σ = 25%, T = 1 → DD = (0.2231 + 0.0288)/0.25 = <code>1.01</code>, PD = N(−1.01) ≈ <code>15.7%</code>'],
  a:'Waiting is worth $19.21 vs $5 now. Merton PD ≈ 15.7%'},
 traps:['Using the real-world probability in the roll-back.','Comparing the option with zero instead of with investing now.','In Merton, using the stock\'s volatility as the asset volatility.'],
 files:['Valuation/03 Lectures/FRE6103_LECTURE_11_Options_in_a_valuation_context.pdf','Valuation/03 Lectures/FRE6103_LECTURE_14_VL14_Real_Options_in_Energy.pdf','Valuation/02 Books and Readings/FRE6103_BOOK_02_Corporate_Finance_Ivo_Welch_4e_Early_Preview_2016.pdf','Risk syllabus RMN6 (Merton, distance to default)'],
 sketch:{caps:['Today the project is worth $105 and costs $100. NPV = $5.','Next year it is worth $140 (good) or $80 (bad).','If you wait, you invest only in the good case: gain $40. In the bad case you walk away: $0.','Rolled back with p = 0.504: the right to wait is worth $19.21. Waiting wins.','Same idea for a firm: shareholders get max(Assets − Debt, 0). Equity is a call on the assets.'],
  draw:()=>{let it=[[0,R(40,130,140,64,'fs')+T(110,158,'V = $105','mono','text-anchor="middle"')+T(110,178,'NPV = 5','mono tp','text-anchor="middle"')]];
   it.push([1,P('M180,150L290,80','s')+P('M180,174L290,240','s')+R(290,50,120,56,'fs')+T(350,84,'$140','mono','text-anchor="middle"')+R(290,214,120,56,'fs')+T(350,248,'$80','mono','text-anchor="middle"')]);
   it.push([2,AR(410,78,450,78,'sg')+T(458,84,'invest: +40','tg mono')+AR(410,242,450,242,'sp')+T(458,248,'walk away: 0','tp mono')]);
   it.push([3,R(40,130,140,64,'fh')+T(110,158,'wait = $19.21','mono','text-anchor="middle"')+T(110,178,'> 5','mono','text-anchor="middle"')]);
   const g=F(470,132,140,64,40,140,0,60);it.push([4,R(445,105,185,118,'fs',6)+P(`M${g.sx(40)},${g.sy(0)}L${g.sx(80)},${g.sy(0)}L${g.sx(140)},${g.sy(60)}`,'sb')+T(g.sx(80),g.sy(0)+16,'D','tm','text-anchor="middle"')+T(g.x,g.y-6,'equity vs assets','tm')]);return it}}},
